        function hexToRGB(hex) {
            const n = parseInt(hex.slice(1), 16);
            return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
        }
        function rgba(hex, a) {
            const n = parseInt(hex.slice(1), 16);
            return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
        }
        function shade(hex, amt) {
            const n = parseInt(hex.slice(1), 16);
            let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
            if (amt >= 0) { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
            else { r *= (1 + amt); g *= (1 + amt); b *= (1 + amt); }
            r = clamp(r, 0, 255) | 0; g = clamp(g, 0, 255) | 0; b = clamp(b, 0, 255) | 0;
            return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
        }
        function mulberry32(a) {
            return function () {
                a |= 0; a = a + 0x6D2B79F5 | 0;

                t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            };

                { label: '3C 273', color: '#050510', glow: '#ff9a5c', tex: 'blackhole' },
            ],
        ];

        function stageOf(m) {
            let s = 0;
            for (let i = 0; i < STAGES.length; i++) if (m >= STAGES[i].min) s = i;
            return s;
        }
        function radiusOf(m) { return 18 * Math.cbrt(m / 100); }

        const cv = document.getElementById('cv');
        const ctx = cv.getContext('2d', { alpha: false });
        let W = 0, H = 0, DPR = 1;

        function resize() {
            const maxDPR = 2;
            DPR = Math.min(window.devicePixelRatio || 1, maxDPR);
            W = window.innerWidth; H = window.innerHeight;

            cv.height = Math.floor(H * DPR);

        let STARS = [];
        function buildStars() {
            STARS = [];
            const n = Math.round(clamp(W * H / 2600, 260, 550));
            for (let i = 0; i < n; i++) {
                STARS.push({

        let NEBULAS = [];
        function buildNebula() {
            const palette = [
                ['rgba(70,40,140,0.20)', 'rgba(20,10,60,0)'],
                ['rgba(20,60,130,0.18)', 'rgba(5,15,45,0)'],

                });

        }

        const glowCache = new Map();
        function getGlow(color, size) {
            const key = color + size;
            let c = glowCache.get(key);
            if (c) return c;
            c = document.createElement('canvas');
            c.width = c.height = size * 2;
            const g = c.getContext('2d');
            const grad = g.createRadialGradient(size, size, 0, size, size, size);
            grad.addColorStop(0.00, rgba(color, 0.95));
            grad.addColorStop(0.18, rgba(color, 0.55));
            grad.addColorStop(0.42, rgba(color, 0.18));
            grad.addColorStop(1.00, rgba(color, 0));
            g.fillStyle = grad;
            g.fillRect(0, 0, size * 2, size * 2);
            glowCache.set(key, c);
            return c;
        }

        const TEX = 256;
        const texCache = new Map();
        let lightCanvas = null;

        function getLight() {
            if (lightCanvas) return lightCanvas;
            const S = TEX;
            const c = document.createElement('canvas');
            c.width = c.height = S;
            const g = c.getContext('2d');
            const cx = S / 2, cy = S / 2;
            const grad = g.createRadialGradient(cx - S * 0.16, cy - S * 0.16, S * 0.02, cx, cy, S * 0.5);
            grad.addColorStop(0.00, 'rgba(255,255,255,1)');
            grad.addColorStop(0.30, 'rgba(238,240,248,1)');
            grad.addColorStop(0.62, 'rgba(150,158,185,1)');
            grad.addColorStop(0.86, 'rgba(45,50,75,1)');
            grad.addColorStop(1.00, 'rgba(8,10,20,1)');
            g.fillStyle = grad;
            g.beginPath(); g.arc(cx, cy, S * 0.5, 0, TAU); g.fill();
            lightCanvas = c;
            return c;
        }

        function paintTexture(g, S, texType, baseColor, seed) {
            const r2 = mulberry32(seed);
            const rnd = () => r2();
            const randR = (a, b) => a + r2() * (b - a);

            g.fillStyle = baseColor;
            g.fillRect(0, 0, S, S);

            function wrapDraw(x, margin, fn) {
                fn(x);
                if (x < margin) fn(x + S);
                else if (x > S - margin) fn(x - S);
            }

            function addNoise(count, intensity) {
                for (let i = 0; i < count; i++) {
                    const x = rnd() * S, y = rnd() * S, r = randR(0.5, 2.5);
                    const v = (rnd() - 0.5) * 2 * intensity;
                    g.fillStyle = rgba(shade(baseColor, v), 0.5);
                    wrapDraw(x, r * 2, (xx) => {
                        g.beginPath(); g.arc(xx, y, r, 0, TAU); g.fill();
                    });
                }
            }

            function addCraters(count, minR, maxR) {
                for (let i = 0; i < count; i++) {
                    const x = rnd() * S, y = rnd() * S;
                    const cr = randR(minR, maxR);
                    wrapDraw(x, cr * 1.5, (xx) => {
                        const grad = g.createRadialGradient(xx, y, 0, xx, y, cr);
                        grad.addColorStop(0, rgba(shade(baseColor, -0.35), 0.75));
                        grad.addColorStop(0.7, rgba(shade(baseColor, -0.15), 0.5));
                        grad.addColorStop(1, rgba(shade(baseColor, -0.1), 0));
                        g.fillStyle = grad;
                        g.beginPath(); g.arc(xx, y, cr, 0, TAU); g.fill();
                        g.strokeStyle = rgba(shade(baseColor, 0.35), 0.3);
                        g.lineWidth = Math.max(0.6, cr * 0.12);
                        g.beginPath();
                        g.arc(xx, y, cr * 0.95, -0.2, Math.PI + 0.2);
                        g.stroke();
                    });
                }
            }

            function addBands(colors, waveAmp, bandCount) {
                for (let i = 0; i < bandCount; i++) {
                    const y0 = (i / bandCount) * S;
                    const bh = S / bandCount * randR(0.7, 1.4);
                    const c = colors[Math.floor(rnd() * colors.length)];
                    const freq = Math.max(1, Math.round(randR(1, 3)));
                    const phase = rnd() * TAU;
                    const freq2 = Math.max(1, Math.round(randR(1, 3)));
                    const phase2 = rnd() * TAU;
                    g.fillStyle = c;
                    g.beginPath();
                    for (let x = 0; x <= S; x += 4) {
                        const y = y0 + Math.sin(x / S * TAU * freq + phase) * waveAmp;
                        if (x === 0) g.moveTo(x, y); else g.lineTo(x, y);
                    }
                    for (let x = S; x >= 0; x -= 4) {
                        const y = y0 + bh + Math.sin(x / S * TAU * freq2 + phase2) * waveAmp;
                        g.lineTo(x, y);
                    }
                    g.closePath();
                    g.fill();
                }
            }

            function addContinents(colors, count, minSize, maxSize) {
                for (let i = 0; i < count; i++) {
                    const cx = rnd() * S, cy = rnd() * S;
                    const size = randR(minSize, maxSize);
                    const c = colors[Math.floor(rnd() * colors.length)];
                    const blobs = 3 + Math.floor(rnd() * 4);
                    const blobList = [];
                    for (let b = 0; b < blobs; b++) {
                        blobList.push({
                            dx: (rnd() - 0.5) * size * 1.4,
                            dy: (rnd() - 0.5) * size * 1.4,
                            r: size * randR(0.35, 0.75),
                        });
                    }
                    wrapDraw(cx, size * 1.5, (xx) => {
                        g.fillStyle = c;
                        g.beginPath();
                        for (const bl of blobList) {
                            g.moveTo(xx + bl.dx + bl.r, cy + bl.dy);
                            g.arc(xx + bl.dx, cy + bl.dy, bl.r, 0, TAU);
                        }
                        g.fill();
                    });
                }
            }

            function addClouds(color, count, size) {
                for (let i = 0; i < count; i++) {
                    const cx = rnd() * S, cy = rnd() * S;
                    const cs = randR(size * 0.5, size);
                    const blobs = 3 + Math.floor(rnd() * 3);
                    const blobList = [];
                    for (let b = 0; b < blobs; b++) {
                        blobList.push({
                            dx: (rnd() - 0.5) * cs,
                            dy: (rnd() - 0.5) * cs * 0.4,
                            r: cs * randR(0.3, 0.6),
                        });
                    }
                    wrapDraw(cx, cs * 1.5, (xx) => {
                        g.fillStyle = rgba(color, 0.22 + rnd() * 0.15);
                        g.beginPath();
                        for (const bl of blobList) {
                            g.moveTo(xx + bl.dx + bl.r, cy + bl.dy);
                            g.arc(xx + bl.dx, cy + bl.dy, bl.r, 0, TAU);
                        }
                        g.fill();
                    });
                }
            }

            function addCracks(count, color, width) {
                g.strokeStyle = color;
                g.lineCap = 'round';
                for (let i = 0; i < count; i++) {
                    const x = rnd() * S, y = rnd() * S;
                    const len = randR(S * 0.08, S * 0.25);
                    const angle0 = rnd() * TAU;
                    wrapDraw(x, len, (xx) => {
                        g.lineWidth = width * randR(0.5, 1.2);
                        g.globalAlpha = 0.35 + rnd() * 0.3;
                        g.beginPath();
                        g.moveTo(xx, y);
                        let cx = xx, cy = y, a = angle0;
                        const segs = 3 + Math.floor(rnd() * 3);
                        for (let s = 0; s < segs; s++) {
                            a += (rnd() - 0.5) * 0.8;
                            cx += Math.cos(a) * len / segs;
                            cy += Math.sin(a) * len / segs;
                            g.lineTo(cx, cy);
                        }
                        g.stroke();
                        g.globalAlpha = 1;
                    });
                }
            }

            switch (texType) {
                case 'carbon':
                    addNoise(120, 0.45);
                    addCraters(18, S * 0.015, S * 0.05);
                    addContinents([rgba(shade(baseColor, -0.3), 0.4)], 8, S * 0.02, S * 0.05);
                    break;

                case 'stony':
                    addNoise(100, 0.35);
                    addCraters(14, S * 0.015, S * 0.06);
                    addContinents([rgba(shade(baseColor, 0.15), 0.3)], 8, S * 0.03, S * 0.07);
                    break;

                case 'metal':
                    for (let i = 0; i < 45; i++) {
                        const y = rnd() * S;
                        const h = randR(0.5, 2.5);
                        g.fillStyle = rgba(shade(baseColor, (rnd() - 0.5) * 0.5), 0.4);
                        g.fillRect(0, y, S, h);
                    }
                    for (let i = 0; i < 25; i++) {
                        const x = rnd() * S, y = rnd() * S, r = randR(1, 3);
                        g.fillStyle = rgba('#ffffff', 0.35);
                        wrapDraw(x, r * 2, (xx) => { g.beginPath(); g.arc(xx, y, r, 0, TAU); g.fill(); });
                    }
                    break;

                case 'icy':
                    addNoise(60, 0.3);
                    addCracks(16, rgba(shade(baseColor, -0.4), 0.6), 1.6);
                    addClouds(shade(baseColor, 0.25), 6, S * 0.05);
                    break;

                case 'cratered':
                    addNoise(80, 0.35);
                    addCraters(30, S * 0.012, S * 0.06);
                    addContinents([rgba(shade(baseColor, -0.2), 0.25)], 5, S * 0.04, S * 0.08);
                    break;

                case 'mercury':
                    addNoise(70, 0.3);
                    addCraters(26, S * 0.012, S * 0.05);
                    addContinents([rgba(shade(baseColor, 0.1), 0.2)], 4, S * 0.04, S * 0.08);
                    break;

                case 'venus':
                    addBands([
                        rgba(shade(baseColor, 0.15), 0.6),
                        rgba(shade(baseColor, -0.15), 0.5),
                        rgba(shade(baseColor, 0.25), 0.4),
                        rgba(shade(baseColor, -0.05), 0.5),
                    ], S * 0.015, 9);
                    addClouds(shade(baseColor, 0.3), 12, S * 0.045);
                    break;

                case 'earth': {
                    addNoise(40, 0.2);
                    addContinents(['#2e6b30', '#3a7a3a', '#4a6030', '#6b5a3a'], 7, S * 0.03, S * 0.08);
                    const topGrad = g.createLinearGradient(0, 0, 0, S * 0.12);
                    topGrad.addColorStop(0, 'rgba(255,255,255,0.9)');
                    topGrad.addColorStop(1, 'rgba(255,255,255,0)');
                    g.fillStyle = topGrad;
                    g.fillRect(0, 0, S, S * 0.12);
                    const botGrad = g.createLinearGradient(0, S, 0, S * 0.88);
                    botGrad.addColorStop(0, 'rgba(255,255,255,0.9)');
                    botGrad.addColorStop(1, 'rgba(255,255,255,0)');
                    g.fillStyle = botGrad;
                    g.fillRect(0, S * 0.88, S, S * 0.12);
                    addClouds('#ffffff', 16, S * 0.035);
                    break;
                }

                case 'mars':
                    addNoise(50, 0.25);
                    addContinents([
                        rgba(shade(baseColor, -0.25), 0.4),
                        rgba(shade(baseColor, 0.15), 0.3),
                    ], 10, S * 0.03, S * 0.07);
                    addCraters(10, S * 0.015, S * 0.045);
                    g.fillStyle = 'rgba(255,255,255,0.75)';
                    g.beginPath(); g.ellipse(S * 0.5, 0, S * 0.15, S * 0.05, 0, 0, TAU); g.fill();
                    g.beginPath(); g.ellipse(S * 0.5, S, S * 0.12, S * 0.04, 0, 0, TAU); g.fill();
                    break;

                case 'jupiter': {
                    addBands([
                        'rgba(200,170,130,0.9)',
                        'rgba(160,120,85,0.9)',
                        'rgba(230,210,175,0.9)',
                        'rgba(180,140,100,0.9)',
                        'rgba(210,185,150,0.9)',
                        'rgba(140,100,70,0.9)',
                    ], S * 0.012, 14);
                    const gx = S * 0.3, gy = S * 0.62;
                    const spotGrad = g.createRadialGradient(gx, gy, 0, gx, gy, S * 0.075);
                    spotGrad.addColorStop(0, 'rgba(200,80,40,0.9)');
                    spotGrad.addColorStop(0.7, 'rgba(160,60,30,0.5)');
                    spotGrad.addColorStop(1, 'rgba(140,50,20,0)');
                    g.fillStyle = spotGrad;
                    g.beginPath(); g.ellipse(gx, gy, S * 0.075, S * 0.045, 0, 0, TAU); g.fill();
                    addNoise(40, 0.2);
                    break;
                }

                case 'saturn':
                    addBands([
                        'rgba(220,200,150,0.8)',
                        'rgba(200,175,120,0.7)',
                        'rgba(235,220,170,0.8)',
                        'rgba(210,185,130,0.7)',
                    ], S * 0.008, 10);
                    addNoise(30, 0.15);
                    break;

                case 'iceGiant':
                    addBands([
                        rgba(shade(baseColor, 0.1), 0.5),
                        rgba(shade(baseColor, -0.1), 0.5),
                        rgba(shade(baseColor, 0.15), 0.4),
                    ], S * 0.007, 7);
                    addClouds(shade(baseColor, 0.3), 8, S * 0.035);
                    break;

                case 'brownDwarf':
                    addBands([
                        rgba(shade(baseColor, 0.2), 0.5),
                        rgba(shade(baseColor, -0.2), 0.5),
                        rgba(shade(baseColor, 0.1), 0.4),
                    ], S * 0.015, 8);
                    addClouds(shade(baseColor, 0.35), 10, S * 0.04);
                    break;

                case 'starM':
                case 'starK':
                case 'starG':
                case 'starA':
                case 'starO':
                    for (let i = 0; i < 70; i++) {
                        const x = rnd() * S, y = rnd() * S;
                        const r = randR(S * 0.008, S * 0.035);
                        const lighten = rnd() < 0.5;
                        g.fillStyle = rgba(shade(baseColor, lighten ? 0.35 : -0.35), 0.5);
                        wrapDraw(x, r * 2, (xx) => { g.beginPath(); g.arc(xx, y, r, 0, TAU); g.fill(); });
                    }
                    const coreGrad = g.createRadialGradient(S * 0.5, S * 0.5, 0, S * 0.5, S * 0.5, S * 0.5);
                    coreGrad.addColorStop(0, rgba(shade(baseColor, 0.5), 0.4));
                    coreGrad.addColorStop(0.6, 'rgba(0,0,0,0)');
                    g.fillStyle = coreGrad;
                    g.fillRect(0, 0, S, S);
                    break;

                case 'neutron':
                    g.fillStyle = '#f0f8ff';
                    g.fillRect(0, 0, S, S);
                    for (let i = 0; i < 80; i++) {
                        const y = rnd() * S;
                        g.fillStyle = rgba(shade(baseColor, (rnd() - 0.5) * 0.4), 0.3);
                        g.fillRect(0, y, S, randR(0.5, 1.5));
                    }
                    break;

                default:
                    addNoise(60, 0.3);
            }
        }

        function makeTextureSeamlessX(g, S) {
            const image = g.getImageData(0, 0, S, S);
            const data = image.data;
            const band = Math.max(2, Math.floor(S / 12));

            for (let y = 0; y < S; y++) {
                const row = y * S * 4;
                const leftEdge = row;
                const rightEdge = row + (S - 1) * 4;

                for (let c = 0; c < 4; c++) {
                    const seam = (data[leftEdge + c] + data[rightEdge + c]) * 0.5;

                    for (let x = 0; x < band; x++) {
                        const t = x / (band - 1);
                        const left = row + x * 4 + c;
                        const right = row + (S - band + x) * 4 + c;
                        const leftValue = data[left];
                        const rightValue = data[right];

                        data[left] = seam + (leftValue - seam) * t;
                        data[right] = rightValue * (1 - t) + seam * t;
                    }
                }
            }

            g.putImageData(image, 0, 0);
        }

        function getTex(stageIdx, variantIdx) {
            const key = stageIdx + '_' + variantIdx;
            let t = texCache.get(key);
            if (t) return t;
            const variant = CATALOG[stageIdx][variantIdx];
            const S = TEX;
            const c = document.createElement('canvas');
            c.width = c.height = S;
            const g = c.getContext('2d');
            paintTexture(g, S, variant.tex, variant.color, stageIdx * 7919 + variantIdx * 1337 + 11);
            makeTextureSeamlessX(g, S);
            texCache.set(key, c);
            return c;
        }

        function preloadTextures() {
            for (let s = 0; s < CATALOG.length; s++) {
                for (let v = 0; v < CATALOG[s].length; v++) {
                    getTex(s, v);
                }
            }
        }

        const game = {
            state: 'menu',
            time: 0,
            playTime: 0,
            player: null,
            enemies: [],
            comets: [],
            meteors: [],
            events: [],

        game.mouse.sx = window.innerWidth / 2;
        game.mouse.sy = window.innerHeight / 2;

        const poemState = {
            active: false,
            t: 0,
            particles: [],
            cx: 0, cy: 0,
            tLine1: 1.4,
            tLine2: 3.8,
            tOverlay: 7.5,
            overlayShown: false,
        };

        function startPoemAnimation() {
            poemState.active = true;
            poemState.t = 0;
            poemState.overlayShown = false;
            poemState.cx = W / 2;
            poemState.cy = H / 2;
            poemState.particles = [];

            const count = 900;
            for (let i = 0; i < count; i++) {
                const a = Math.random() * TAU;
                let speed, size;
                const tier = Math.random();
                if (tier < 0.08) {
                    speed = rand(60, 110);
                    size = rand(1.8, 3.2);
                } else if (tier < 0.35) {
                    speed = rand(30, 70);
                    size = rand(1.0, 1.9);
                } else {
                    speed = rand(10, 40);
                    size = rand(0.4, 1.0);
                }

                poemState.particles.push({
                    x: poemState.cx,
                    y: poemState.cy,
                    vx: Math.cos(a) * speed,
                    vy: Math.sin(a) * speed,
                    size: size,
                    life: 1,
                    decay: rand(0.006, 0.028),
                    tw: Math.random() * TAU,
                    color: Math.random() < 0.22 ? '#ffd8a8' : (Math.random() < 0.42 ? '#a9c8ff' : '#ffffff'),
                });
            }
        }

        function updatePoemAnimation(dt) {
            poemState.t += dt;

            for (let i = poemState.particles.length - 1; i >= 0; i--) {
                const p = poemState.particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;

                p.vx *= Math.pow(0.72, dt);
                p.vy *= Math.pow(0.72, dt);

                const swirlK = 0.00035;
                p.vx += (-(p.y - poemState.cy)) * swirlK * dt * 60;
                p.vy += ((p.x - poemState.cx)) * swirlK * dt * 60;

                p.life -= p.decay * dt * 6;
                if (p.life <= 0) {
                    poemState.particles.splice(i, 1);
                }
            }

            if (poemState.t >= poemState.tOverlay && !poemState.overlayShown) {
                poemState.overlayShown = true;
                showPoemOver();
            }
        }

        function drawPoemLine(text, cx, cy, progress) {
            if (progress <= 0) return;
            const blur = (1 - progress) * 22;
            const dy = (1 - progress) * 14;
            const breathe = 0.9 + 0.1 * Math.sin(poemState.t * 1.6);

            const fs = clamp(W * 0.04, 14, 25);
            ctx.save();
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = `300 ${fs}px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif`;
            ctx.shadowBlur = blur;
            ctx.shadowColor = 'rgba(140,200,255,0.92)';
            ctx.globalAlpha = progress * breathe;
            ctx.fillStyle = '#e0ecff';
            ctx.fillText(text, cx, cy + dy);
            ctx.restore();
        }

        function drawPoemAnimation() {
            const time = poemState.t;

            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            for (const p of poemState.particles) {
                const tw = 0.6 + 0.4 * Math.sin(time * 2.2 + p.tw);
                ctx.globalAlpha = clamp(p.life, 0, 1) * tw * 0.9;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, TAU);
                ctx.fill();
            }
            ctx.restore();

            const p1 = clamp((time - poemState.tLine1) / 2.0, 0, 1);
            const p2 = clamp((time - poemState.tLine2) / 2.2, 0, 1);

            if (p1 > 0) {
                drawPoemLine('在微小的沙粒中', W / 2, H * 0.40, p1);
            }
            if (p2 > 0) {
                drawPoemLine('也藏着许多鲜为人知的壮丽诗篇', W / 2, H * 0.49, p2);
            }
        }

        let isPointerDown = false;
        let activePointerId = null;

        function stickMaxR() {
            return Math.min(64, Math.min(W, H) * 0.14);
        }
        const STICK_DEAD = 4;

        function updateStickFromPoint(px, py) {
            const s = game.stick;
            s.curX = px; s.curY = py;
            const dx = s.curX - s.anchorX;
            const dy = s.curY - s.anchorY;
            const len = Math.hypot(dx, dy);
            const maxR = stickMaxR();
            if (len > STICK_DEAD) {
                s.dirX = dx / len;
                s.dirY = dy / len;
                s.strength = clamp((len - STICK_DEAD) / (maxR - STICK_DEAD) * 1.25, 0, 1);
            } else {
                s.dirX = 0; s.dirY = 0; s.strength = 0;
            }
        }

        function resetStick() {
            const s = game.stick;
            s.active = false;
            s.pointerId = null;
            s.dirX = 0; s.dirY = 0; s.strength = 0;
        }

        function setPointerTarget(x, y) {
            game.mouse.sx = x;
            game.mouse.sy = y;
        }

        cv.addEventListener('pointerdown', e => {
            if (game.state !== 'play') return;
            isPointerDown = true;
            activePointerId = e.pointerId;
            try { cv.setPointerCapture(e.pointerId); } catch (_) { }

            if (e.pointerType === 'mouse') {
                game.controlMode = 'pointer';
                setPointerTarget(e.clientX, e.clientY);
                game.touchIndicator.active = false;
                resetStick();
            } else {
                game.controlMode = 'stick';
                const s = game.stick;
                s.active = true;
                s.pointerId = e.pointerId;
                s.anchorX = e.clientX;
                s.anchorY = e.clientY;
                s.curX = e.clientX;
                s.curY = e.clientY;
                s.dirX = 0; s.dirY = 0; s.strength = 0;
                game.touchIndicator.active = false;
            }
            e.preventDefault();
        }, { passive: false });

        cv.addEventListener('pointermove', e => {
            if (game.state !== 'play') return;

            if (e.pointerType === 'mouse') {
                game.controlMode = 'pointer';
                setPointerTarget(e.clientX, e.clientY);
                return;
            }

            if (game.stick.active && e.pointerId === game.stick.pointerId) {
                updateStickFromPoint(e.clientX, e.clientY);
            }
        }, { passive: true });

        function endPointer(e) {
            if (e.pointerId === activePointerId) {
                isPointerDown = false;
                activePointerId = null;
            }
            if (game.stick.active && e.pointerId === game.stick.pointerId) {
                resetStick();
            }
            game.touchIndicator.active = false;
        }
        cv.addEventListener('pointerup', endPointer);
        cv.addEventListener('pointercancel', endPointer);

        if (!window.PointerEvent) {
            cv.addEventListener('touchstart', e => {
                if (!e.touches.length) return;
                const t = e.touches[0];
                game.controlMode = 'stick';
                const s = game.stick;
                s.active = true;
                s.pointerId = t.identifier;
                s.anchorX = t.clientX;
                s.anchorY = t.clientY;
                s.curX = t.clientX;
                s.curY = t.clientY;
                s.dirX = 0; s.dirY = 0; s.strength = 0;
                isPointerDown = true;
                e.preventDefault();
            }, { passive: false });

            cv.addEventListener('touchmove', e => {
                if (!e.touches.length) return;
                const s = game.stick;
                let t = null;
                for (let i = 0; i < e.touches.length; i++) {
                    if (e.touches[i].identifier === s.pointerId) { t = e.touches[i]; break; }
                }
                if (!t) t = e.touches[0];
                updateStickFromPoint(t.clientX, t.clientY);
                e.preventDefault();
            }, { passive: false });

            cv.addEventListener('touchend', e => {
                let still = false;
                for (let i = 0; i < e.touches.length; i++) {
                    if (e.touches[i].identifier === game.stick.pointerId) { still = true; break; }
                }
                if (!still) resetStick();
                isPointerDown = false;
            });

            window.addEventListener('mousemove', e => {
                game.controlMode = 'pointer';
                setPointerTarget(e.clientX, e.clientY);
            });
        }

        function evolveEntity(ent, newStage) {
            if (!ent || newStage <= ent.stage) return false;
            ent.stage = newStage;
            const list = CATALOG[newStage] || CATALOG[CATALOG.length - 1];
            const vi = ent.isPlayer ? 0 : Math.floor(Math.random() * list.length);
            ent.variant = vi;
            if (ent.label) ent.label = list[vi].label;
            if (ent.color) ent.color = list[vi].color;
            if (ent.glow) ent.glow = list[vi].glow;
            return true;
        }

        function syncPlayerStage(p) {
            const ns = stageOf(p.mass);
            if (ns !== p.stage) {
                p.stage = ns;
                p.variant = 0;
            }
        }

        class TidalEvent {
            constructor(victim, devourer, isPlayerDevourer) {
                this.devourer = devourer;
                this.isPlayerDevourer = isPlayerDevourer;
                const dx = victim.x - devourer.x;
                const dy = victim.y - devourer.y;
                this.dist = Math.hypot(dx, dy) || 1;
                this.angle = Math.atan2(dy, dx);
                this.orbitRadius = this.dist;
                this.baseR = victim.r;
                this.color = victim.color;
                this.glow = victim.glow;
                this.stageIdx = victim.stage;
                this.variant = victim.variant;
                this.age = 0;
                this.duration = isPlayerDevourer ? 2.4 : 1.8;
                this.stretchRatio = 1.0;
                this.heat = 0.0;
                this.disruptionProgress = 0;
                this.particles = [];
                this.spawnAccum = 0;
                this.massPool = victim.mass;
                this.massRate = victim.mass / 1.4;
                this.absorbDelay = 0.32;
                this.baseRGB = hexToRGB(victim.color);
                this.shock = 1.0;
            }

            spawnDebris() {
                if (this.particles.length > 180) return;
                const isFarSide = Math.random() < 0.35;
                const poleAngle = this.angle + (isFarSide ? 0 : Math.PI);
                const ejectAngle = poleAngle + rand(-0.6, 0.6);
                const rx = this.baseR * this.stretchRatio;
                const ry = Math.max(2, this.baseR / Math.sqrt(this.stretchRatio));
                const localX = (isFarSide ? 0.8 : -0.8) * rx;
                const localY = rand(-ry, ry);
                const cosA = Math.cos(this.angle), sinA = Math.sin(this.angle);
                const bodyCenterX = this.devourer.x + Math.cos(this.angle) * this.dist;
                const bodyCenterY = this.devourer.y + Math.sin(this.angle) * this.dist;
                const px = bodyCenterX + (localX * cosA - localY * sinA);
                const py = bodyCenterY + (localX * sinA + localY * cosA);
                const orbSpeed = Math.sqrt(350000 / (this.dist + 10));
                const tangentAngle = this.angle + Math.PI / 2;
                const vx = Math.cos(tangentAngle) * orbSpeed + Math.cos(ejectAngle) * rand(20, 70);
                const vy = Math.sin(tangentAngle) * orbSpeed + Math.sin(ejectAngle) * rand(20, 70);

                this.particles.push({
                    x: px - this.devourer.x, y: py - this.devourer.y,
                    vx, vy, size: rand(0.8, 2.5), trail: [], maxTrail: Math.floor(rand(4, 9)),
                });
            }

            update(dt) {
                const previousAge = this.age;
                this.age += dt;
                const progress = clamp(this.age / this.duration, 0, 1);
                this.disruptionProgress = progress;
                const spiralFactor = Math.pow(progress, 0.85);
                this.dist = lerp(this.orbitRadius, this.devourer.r * 0.4, spiralFactor);

                const rocheForce = Math.pow(1 - clamp(this.dist / (this.devourer.r * 4), 0, 1), 2);
                this.stretchRatio = 1.0 + rocheForce * 3.5 + progress * 2.0;
                this.heat = clamp(rocheForce * 1.5 + progress * 1.2, 0, 1);

                const absorbDt = Math.max(0, this.age - this.absorbDelay) - Math.max(0, previousAge - this.absorbDelay);
                const maxNpcMass = STAGES[10].min * 0.95;
                const remainingCapacity = this.devourer.isPlayer ? Infinity : Math.max(0, maxNpcMass - this.devourer.mass);
                const tr = Math.min(this.massPool, this.massRate * absorbDt, remainingCapacity);
                if (tr > 0) {
                    this.devourer.mass += tr;
                    this.massPool -= tr;
                    this.devourer.r = radiusOf(this.devourer.mass);
                    evolveEntity(this.devourer, stageOf(this.devourer.mass));
                    if (this.isPlayerDevourer) this.devourer.pulse = 1;
                }

                this.shock *= Math.pow(0.01, dt);
                if (progress < 0.95) {
                    const rate = 50 + progress * 250;
                    this.spawnAccum += dt * rate;
                    while (this.spawnAccum >= 1) {
                        this.spawnAccum -= 1;
                        this.spawnDebris();
                    }
                }

                const GM = 4.2e5, soft2 = 400;
                const eventHorizon = this.devourer.r * 0.7;

                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    const r2 = p.x * p.x + p.y * p.y;
                    const r = Math.sqrt(r2);
                    if (r < eventHorizon || r > this.devourer.r * 35) {
                        this.particles.splice(i, 1); continue;
                    }
                    const acc = GM / (r2 + soft2);
                    p.vx -= (p.x / r) * acc * dt;
                    p.vy -= (p.y / r) * acc * dt;
                    p.vx *= Math.pow(0.965, dt * 60);
                    p.vy *= Math.pow(0.965, dt * 60);
                    p.x += p.vx * dt; p.y += p.vy * dt;
                    p.trail.unshift({ x: p.x, y: p.y });
                    if (p.trail.length > p.maxTrail) p.trail.pop();
                }
                return progress >= 1.0 && this.particles.length === 0;
            }

            draw() {
                const dev = this.devourer;
                const bodyX = dev.x + Math.cos(this.angle) * this.dist;
                const bodyY = dev.y + Math.sin(this.angle) * this.dist;

                if (this.shock > 0.02) {
                    ctx.save();
                    ctx.globalCompositeOperation = 'lighter';
                    const shockR = this.baseR * (1.5 + (1 - this.shock) * 4.0);
                    const g = ctx.createRadialGradient(bodyX, bodyY, 0, bodyX, bodyY, shockR);
                    g.addColorStop(0, `rgba(255,245,220,${0.6 * this.shock})`);
                    g.addColorStop(0.3, `rgba(255,140,50,${0.3 * this.shock})`);
                    g.addColorStop(1, 'rgba(255,80,0,0)');
                    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(bodyX, bodyY, shockR, 0, TAU); ctx.fill();
                    ctx.restore();
                }

                if (this.particles.length) {
                    ctx.save();
                    ctx.globalCompositeOperation = 'lighter';
                    const br = this.baseRGB;
                    for (let i = 0; i < this.particles.length; i++) {
                        const p = this.particles[i];
                        const distToDev = Math.hypot(p.x, p.y);
                        const heatNorm = clamp(1.0 - (distToDev - dev.r) / (dev.r * 4.0), 0, 1);
                        const cr = Math.round(lerp(br.r, 255, heatNorm));
                        const cg = Math.round(lerp(br.g, 210, heatNorm));
                        const cb = Math.round(lerp(br.b, 160, heatNorm));

                        if (p.trail.length > 1) {
                            ctx.beginPath();
                            ctx.moveTo(dev.x + p.trail[0].x, dev.y + p.trail[0].y);
                            for (let j = 1; j < p.trail.length; j++) {
                                ctx.lineTo(dev.x + p.trail[j].x, dev.y + p.trail[j].y);
                            }
                            ctx.strokeStyle = `rgba(${cr},${cg},${cb},${0.4 + heatNorm * 0.5})`;
                            ctx.lineWidth = p.size * (1 + heatNorm * 0.8);
                            ctx.stroke();
                        }

                        ctx.fillStyle = `rgba(${cr},${cg},${cb},${0.6 + heatNorm * 0.4})`;
                        ctx.beginPath(); ctx.arc(dev.x + p.x, dev.y + p.y, p.size * (0.8 + heatNorm * 0.6), 0, TAU); ctx.fill();
                    }
                    ctx.restore();
                }

                if (this.disruptionProgress < 0.98) {
                    ctx.save();
                    ctx.translate(bodyX, bodyY);
                    const bodyFade = clamp(1 - this.disruptionProgress * 1.15, 0, 1);

                    if (this.heat > 0.05) {
                        ctx.save();
                        ctx.globalCompositeOperation = 'lighter';
                        const glowR = this.baseR * 2.2;
                        const hg = ctx.createRadialGradient(0, 0, this.baseR * 0.3, 0, 0, glowR);
                        hg.addColorStop(0, `rgba(255,220,150,${this.heat * 0.8})`);
                        hg.addColorStop(0.5, `rgba(255,100,30,${this.heat * 0.4})`);
                        hg.addColorStop(1, 'rgba(200,30,0,0)');
                        ctx.fillStyle = hg; ctx.fillRect(-glowR, -glowR, glowR * 2, glowR * 2);
                        ctx.restore();
                    }

                    ctx.globalAlpha = bodyFade;
                    drawBody(0, 0, this.baseR, this.stageIdx, this.variant, 0);
                    ctx.restore();
                }

                if (this.disruptionProgress > 0.02 && this.disruptionProgress < 0.99) {
                    const innerR = dev.r * 0.82;
                    const outerR = lerp(Math.max(dev.r * 1.25, this.orbitRadius), innerR * 1.15, this.disruptionProgress * 0.72);
                    const fade = Math.sin(Math.PI * clamp(this.disruptionProgress, 0, 1));

                    ctx.save();
                    ctx.globalCompositeOperation = 'lighter';
                    ctx.lineCap = 'round';

                    for (let arm = 0; arm < 2; arm++) {
                        ctx.beginPath();
                        const turns = Math.PI * 4.2;
                        const startAngle = this.angle + arm * Math.PI + this.age * 0.7;
                        for (let i = 0; i <= 80; i++) {
                            const t = i / 80;
                            const radius = outerR * Math.pow(innerR / outerR, t);
                            const a = startAngle + turns * t;
                            const x = dev.x + Math.cos(a) * radius;
                            const y = dev.y + Math.sin(a) * radius;
                            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                        }
                        ctx.strokeStyle = arm === 0
                            ? `rgba(255,205,145,${0.16 + 0.34 * fade})`
                            : `rgba(125,185,235,${0.08 + 0.2 * fade})`;
                        ctx.lineWidth = Math.max(1, this.baseR * (arm === 0 ? 0.055 : 0.025));
                        ctx.stroke();
                    }

                    const streamX = dev.x + Math.cos(this.angle) * this.dist;
                    const streamY = dev.y + Math.sin(this.angle) * this.dist;
                    ctx.beginPath();
                    ctx.moveTo(streamX, streamY);
                    ctx.quadraticCurveTo(
                        dev.x + Math.cos(this.angle + 1.1) * outerR * 0.62,
                        dev.y + Math.sin(this.angle + 1.1) * outerR * 0.62,
                        dev.x + Math.cos(this.angle + 2.2) * innerR,
                        dev.y + Math.sin(this.angle + 2.2) * innerR
                    );
                    ctx.strokeStyle = `rgba(255,220,175,${0.3 * fade})`;
                    ctx.lineWidth = Math.max(1, this.baseR * 0.035);
                    ctx.stroke();
                    ctx.restore();
                }
            }
        }

        class MutualCrashEvent {
            constructor(x, y, r, colorA, colorB) {
                this.x = x; this.y = y; this.r = r * 1.5;
                this.colorA = colorA; this.colorB = colorB;
                this.age = 0; this.duration = 1.6;
                this.particles = []; this.shock = 1.0;

                for (let i = 0; i < 110; i++) {
                    const a = Math.random() * TAU, sp = rand(70, 360);
                    this.particles.push({
                        x: this.x + rand(-10, 10), y: this.y + rand(-10, 10),
                        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
                        size: rand(1.2, 3.8), color: Math.random() < 0.5 ? this.colorA : this.colorB,
                        life: 1.0
                    });
                }
            }

            update(dt) {
                this.age += dt;
                const progress = clamp(this.age / this.duration, 0, 1);
                this.shock *= Math.pow(0.01, dt);

                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.x += p.vx * dt; p.y += p.vy * dt;
                    p.vx *= Math.pow(0.5, dt * 4); p.vy *= Math.pow(0.5, dt * 4);
                    p.life -= dt * 1.2;
                    if (p.life <= 0) this.particles.splice(i, 1);
                }
                return progress >= 1.0 && this.particles.length === 0;
            }

            draw() {
                if (this.shock > 0.05) {
                    ctx.save();
                    ctx.globalCompositeOperation = 'lighter';
                    const r = this.r * (1 + (1 - this.shock) * 4.0);
                    const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, r);
                    g.addColorStop(0, 'rgba(255,240,200,0.85)');
                    g.addColorStop(0.4, 'rgba(120,220,255,0.45)');
                    g.addColorStop(1, 'rgba(0,100,255,0)');
                    ctx.fillStyle = g;
                    ctx.beginPath(); ctx.arc(this.x, this.y, r, 0, TAU); ctx.fill();
                    ctx.restore();
                }

                if (this.particles.length) {
                    ctx.save();
                    ctx.globalCompositeOperation = 'lighter';
                    for (const p of this.particles) {
                        ctx.fillStyle = p.color;
                        ctx.globalAlpha = clamp(p.life, 0, 1);
                        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill();
                    }
                    ctx.restore();
                }
            }
        }

        function addSparks(x, y, color, n) {
            for (let i = 0; i < n; i++) {
                const a = Math.random() * TAU, sp = rand(40, 220);
                game.sparks.push({
                    x, y,
                    vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
                    life: 1, color, size: rand(1.2, 3.5)
                });
            }
        }

        function shatterEnemyIntoFrags(e) {
            e.dead = true;
            game.events.push(new MutualCrashEvent(e.x, e.y, e.r, '#ff3333', e.color));
            addNpcCollisionShake(e.x, e.y);
            addCollisionRipple(e.x, e.y, e.r, e.color || '#ff4444');

            if (game.enemies.length > 220) return;

            const count = Math.floor(rand(6, 10));
            const fragMass = (e.mass * 0.85) / count;
            for (let i = 0; i < count; i++) {
                const fa = Math.random() * TAU, fs = rand(80, 260);
                game.enemies.push({
                    x: e.x + Math.cos(fa) * (e.r * 0.4),
                    y: e.y + Math.sin(fa) * (e.r * 0.4),
                    vx: Math.cos(fa) * fs, vy: Math.sin(fa) * fs,
                    mass: fragMass, r: radiusOf(fragMass), stage: stageOf(fragMass),
                    variant: 0, label: '', color: e.color, glow: e.glow,
                    angle: Math.random() * TAU, spin: rand(-1, 1),
                    aiTimer: 0, dead: false,
                    debris: true,
                });
            }
        }

        function fragmentPlanet(target, impactX, impactY, impactVx, impactVy, impactMass, violent) {
            if (!target || target.dead) return;
            const originalMass = target.mass;
            const lethal = violent && impactMass >= originalMass * 2.2;
            const maxFragments = Math.max(0, 90 - game.enemies.length);
            const fragmentCount = Math.min(maxFragments, violent ? Math.floor(rand(4, 7)) : Math.floor(rand(2, 5)));
            const lostMass = fragmentCount > 0
                ? originalMass * (lethal ? rand(0.78, 0.88) : violent ? rand(0.24, 0.38) : rand(0.08, 0.16))
                : 0;
            const remainingMass = originalMass - lostMass;
            const fragmentMass = fragmentCount ? lostMass / fragmentCount : 0;
            const impactAngle = Math.atan2(impactVy, impactVx);

            if (lethal || (violent && remainingMass < STAGES[0].min + 1)) {
                if (target.isPlayer) {
                    target.mass = Math.max(15, remainingMass);
                    target.r = radiusOf(target.mass);
                    target.stage = stageOf(target.mass);
                } else {
                    target.dead = true;
                }
            } else {
                target.mass = Math.max(STAGES[0].min + 1, remainingMass);
                target.r = radiusOf(target.mass);
                target.stage = stageOf(target.mass);
                target.variant = target.stage === 0 ? 0 : target.variant;
                if (target.isPlayer) target.pulse = 1;
            }

            for (let i = 0; i < fragmentCount; i++) {
                const spread = rand(-1.25, 1.25);
                const angle = impactAngle + Math.PI + spread;
                const speed = rand(90, 230) * (violent ? 1.25 : 1);
                const mass = fragmentMass;
                const stage = stageOf(mass);
                const variantIdx = stage === 0 ? 0 : Math.floor(Math.random() * CATALOG[stage].length);
                const variant = CATALOG[stage][variantIdx];
                game.enemies.push({
                    x: impactX + Math.cos(angle) * (target.r + 4),
                    y: impactY + Math.sin(angle) * (target.r + 4),
                    vx: impactVx * 0.16 + Math.cos(angle) * speed,
                    vy: impactVy * 0.16 + Math.sin(angle) * speed,
                    mass, r: radiusOf(mass), stage, variant: variantIdx,
                    label: variant.label, color: variant.color, glow: variant.glow,
                    angle: Math.random() * TAU, spin: rand(-1.2, 1.2),
                    aiTimer: 0, aiMode: 'normal', meteorSense: 'careless',
                    meteorCheckTimer: rand(0.2, 0.5), dead: false, debris: true
                });
            }

            const x = target.dead ? impactX : target.x;
            const y = target.dead ? impactY : target.y;
            game.events.push(new MutualCrashEvent(x, y, Math.max(target.r, 12), '#ff9a4c', target.color || '#9ae6ff'));
            addCollisionRipple(x, y, Math.max(target.r, 12), target.color || '#9ae6ff');
            addSparks(impactX, impactY, '#ffb36b', violent ? 30 : 16);
        }

        class DangerMeteor {
            constructor(startX, startY, targetX, targetY, speedScale = 1) {
                this.startX = startX; this.startY = startY;
                this.targetX = targetX; this.targetY = targetY;
                this.x = startX; this.y = startY;

                const roll = Math.random();
                if (roll < 0.55) {
                    this.r = rand(12, 22);
                    this.warningDuration = 1.1;
                } else if (roll < 0.85) {
                    this.r = rand(28, 48);
                    this.warningDuration = 1.4;
                } else {
                    this.r = rand(55, 95);
                    this.warningDuration = 1.8;
                }

                this.warningTimer = this.warningDuration;
                this.dead = false;
                this.isFlying = false;

                const dx = targetX - startX, dy = targetY - startY;
                const dist = Math.hypot(dx, dy) || 1;
                this.angle = Math.atan2(dy, dx);
                this.speed = rand(800, 1200) * speedScale;
                this.vx = (dx / dist) * this.speed;
                this.vy = (dy / dist) * this.speed;
                const pathRoll = Math.random();
                this.pathType = pathRoll < 0.4 ? '直线' : pathRoll < 0.75 ? '弧线' : '偏转';
                this.curve = this.pathType === '直线' ? 0 : rand(220, 520) * (Math.random() < 0.5 ? -1 : 1);

                this.trail = [];
                this.maxTrail = Math.floor(rand(16, 26));
                this.penetrationCount = 0;
                this.penetrates = Math.random() < 0.28;
                this.hitTargets = [];
                this.hitTargetCount = 0;
                this.mass = this.r * this.r * rand(10, 20);
            }

            update(dt) {
                if (this.warningTimer > 0) {
                    this.warningTimer -= dt;
                    if (this.warningTimer <= 0) {
                        this.isFlying = true;
                    }
                    return;
                }

                if (this.curve) {
                    const turn = this.curve / this.speed * dt;
                    const cosTurn = Math.cos(turn), sinTurn = Math.sin(turn);
                    const vx = this.vx, vy = this.vy;
                    this.vx = vx * cosTurn - vy * sinTurn;
                    this.vy = vx * sinTurn + vy * cosTurn;
                    this.angle = Math.atan2(this.vy, this.vx);
                }
                const nextX = this.x + this.vx * dt;
                const nextY = this.y + this.vy * dt;
                const segmentX = nextX - this.x;
                const segmentY = nextY - this.y;
                const segmentLength2 = segmentX * segmentX + segmentY * segmentY;
                const inverseSegmentLength2 = segmentLength2 > 0 ? 1 / segmentLength2 : 0;

                const p = game.player;
                const playerT = clamp(((p.x - this.x) * segmentX + (p.y - this.y) * segmentY) * inverseSegmentLength2, 0, 1);
                const playerHitX = this.x + segmentX * playerT;
                const playerHitY = this.y + segmentY * playerT;
                const playerDx = p.x - playerHitX, playerDy = p.y - playerHitY;
                if (!this.containsHitTarget(p) && playerDx * playerDx + playerDy * playerDy < (p.r + this.r) * (p.r + this.r)) {
                    const impactMass = this.mass + p.mass * Math.min(0.24, this.speed / 6500);
                    const violent = this.r >= p.r * 0.72;
                    if (violent && impactMass >= p.mass * 2.2) {
                        fragmentPlanet(p, playerHitX, playerHitY, this.vx, this.vy, impactMass, !this.penetrates);
                        game.shake = 16;
                        if (!this.penetrates) {
                            gameOver();
                            this.dead = true;
                            return;
                        }
                    } else if (violent) {
                        if (this.penetrates) fragmentPlanet(p, playerHitX, playerHitY, this.vx, this.vy, impactMass, false);
                        else triggerPlayerShatter(p, { x: playerHitX, y: playerHitY, r: this.r, color: '#ff9a4c', vx: this.vx, vy: this.vy, mass: impactMass });
                    } else {
                        fragmentPlanet(p, playerHitX, playerHitY, this.vx, this.vy, impactMass, false);
                    }
                    if (!this.penetrates) {
                        this.dead = true;
                        return;
                    }
                    this.hitTargets[this.hitTargetCount++] = p;
                }

                const enemyCount = game.enemies.length;
                for (let i = 0; i < enemyCount; i++) {
                    const target = game.enemies[i];
                    if (!target || target.dead || this.containsHitTarget(target)) continue;
                    const targetT = clamp(((target.x - this.x) * segmentX + (target.y - this.y) * segmentY) * inverseSegmentLength2, 0, 1);
                    const hitX = this.x + segmentX * targetT;
                    const hitY = this.y + segmentY * targetT;
                    const dx = target.x - hitX, dy = target.y - hitY;
                    if (dx * dx + dy * dy >= (target.r + this.r) * (target.r + this.r)) continue;

                    const impactMass = this.mass + target.mass * Math.min(0.24, this.speed / 6500);
                    const violent = this.r >= target.r * 0.72;
                    fragmentPlanet(target, hitX, hitY, this.vx, this.vy, impactMass, violent);
                    this.penetrationCount++;
                    this.hitTargets[this.hitTargetCount++] = target;
                    if (!this.penetrates) {
                        this.dead = true;
                        return;
                    }
                }

                this.x = nextX;
                this.y = nextY;

                this.trail.unshift({ x: this.x, y: this.y });
                if (this.trail.length > this.maxTrail) this.trail.pop();

                const viewR = Math.max(W, H) / (2 * game.cam.zoom) * 3.5;
                const dx = this.x - p.x, dy = this.y - p.y;
                if (dx * dx + dy * dy > viewR * viewR) this.dead = true;
            }

            containsHitTarget(target) {
                for (let i = 0; i < this.hitTargetCount; i++) {
                    if (this.hitTargets[i] === target) return true;
                }
                return false;
            }

            draw() {
                if (this.warningTimer > 0) {
                    ctx.save();
                    const alpha = 0.4 + 0.6 * Math.sin(game.time * 24);

                    ctx.strokeStyle = `rgba(255, 30, 30, ${alpha * 0.75})`;
                    ctx.lineWidth = Math.max(1.5, this.r * 0.12);
                    ctx.setLineDash([10, 8]);
                    ctx.beginPath();
                    ctx.moveTo(this.startX, this.startY);
                    const endX = this.targetX + Math.cos(this.angle) * 1400;
                    const endY = this.targetY + Math.sin(this.angle) * 1400;
                    const midX = (this.startX + endX) * 0.5;
                    const midY = (this.startY + endY) * 0.5;
                    const normalX = -Math.sin(this.angle), normalY = Math.cos(this.angle);
                    ctx.quadraticCurveTo(midX + normalX * this.curve * 1.8, midY + normalY * this.curve * 1.8, endX, endY);
                    ctx.stroke();

                    ctx.strokeStyle = `rgba(255, 20, 20, ${alpha})`;
                    ctx.lineWidth = Math.max(2, this.r * 0.15);
                    ctx.setLineDash([]);
                    ctx.beginPath();
                    ctx.arc(this.targetX, this.targetY, (this.r * 1.8) * (this.warningTimer / this.warningDuration + 0.2), 0, TAU);
                    ctx.stroke();

                    ctx.restore();
                    return;
                }

                if (this.trail.length > 1) {
                    ctx.save();
                    ctx.globalCompositeOperation = 'lighter';
                    for (let i = 0; i < this.trail.length - 1; i += 2) {
                        const k = 1 - i / this.trail.length;
                        ctx.strokeStyle = `rgba(255, 50, 10, ${k * 0.9})`;
                        ctx.lineWidth = this.r * k * 2.2;
                        ctx.beginPath();
                        ctx.moveTo(this.trail[i].x, this.trail[i].y);
                        ctx.lineTo(this.trail[i + 1].x, this.trail[i + 1].y);
                        ctx.stroke();
                    }
                    ctx.restore();
                }

                ctx.save();
                ctx.globalCompositeOperation = 'lighter';
                const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.r * 3.6);
                g.addColorStop(0, '#ffffff');
                g.addColorStop(0.25, '#ff3300');
                g.addColorStop(1, 'rgba(255,0,0,0)');
                ctx.fillStyle = g;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.r * 3.6, 0, TAU); ctx.fill();
                ctx.restore();
            }
        }

        function spawnDangerMeteor(scatter, showerPattern = null) {
            const p = game.player;
            const viewR = Math.max(W, H) / (2 * game.cam.zoom);

            const ang = Math.random() * TAU;
            const spawnDist = viewR * 1.45;
            const startX = p.x + Math.cos(ang) * spawnDist;
            const startY = p.y + Math.sin(ang) * spawnDist;

            let targetX, targetY;
            if (!scatter) {
                targetX = p.x + rand(-50, 50);
                targetY = p.y + rand(-50, 50);
            } else if (showerPattern === 'fan') {
                const towardPlayer = Math.atan2(p.y - startY, p.x - startX);
                const targetAngle = towardPlayer + rand(-0.75, 0.75);
                const targetDist = rand(viewR * 0.08, viewR * 0.42);
                targetX = p.x + Math.cos(targetAngle) * targetDist;
                targetY = p.y + Math.sin(targetAngle) * targetDist;
            } else if (showerPattern === 'crossfire') {
                targetX = p.x + rand(-viewR * 0.55, viewR * 0.55);
                targetY = p.y + rand(-viewR * 0.38, viewR * 0.38);
            } else {
                const scatterR = rand(viewR * 0.12, viewR * 0.5);
                targetX = p.x + rand(-scatterR, scatterR);
                targetY = p.y + rand(-scatterR, scatterR);
            }

            const meteor = new DangerMeteor(startX, startY, targetX, targetY, showerPattern ? rand(1.7, 2.0) : 1);
            meteor.isShower = !!showerPattern;
            game.meteors.push(meteor);
        }

        class Comet {
            constructor(x, y, vx, vy) {
                this.x = x; this.y = y;
                this.vx = vx; this.vy = vy;
                this.r = rand(5, 8.5);
                this.dead = false;
                this.state = 'free';
                this.orbitRadius = 0;
                this.orbitAngle = 0;
                this.orbitSpeed = 0;
                this.mass = Math.max(12, this.r * this.r * rand(10, 18));
                this.trail = [];
                this.maxTrail = 14;
                this.moveFactor = 0.75;
            }

            update(dt) {
                const p = game.player;

                if (this.state === 'free') {
                    this.x += this.vx * dt * this.moveFactor;
                    this.y += this.vy * dt * this.moveFactor;

                    const dx = this.x - p.x, dy = this.y - p.y;
                    const dist2 = dx * dx + dy * dy;
                    const playerHitRadius = p.r + this.r * 0.5;

                    if (dist2 < playerHitRadius * playerHitRadius) {
                        this.dead = true;
                        p.mass = Math.max(10, p.mass - 150);
                        p.r = radiusOf(p.mass);
                        syncPlayerStage(p);
                        game.shake = 6;
                        addSparks(this.x, this.y, '#90e0ff', 25);
                        return;
                    }

                    const orbitMin = p.r * 1.1, orbitMax = p.r * 3.8;
                    if (dist2 < orbitMax * orbitMax && dist2 > orbitMin * orbitMin) {
                        this.state = 'orbit';
                        this.orbitRadius = Math.sqrt(dist2);
                        this.orbitAngle = Math.atan2(dy, dx);
                        this.orbitSpeed = rand(2.5, 4.0) * (Math.random() < 0.5 ? 1 : -1);
                        game.ripples.push({ x: this.x, y: this.y, r: 5, max: 45, life: 0.8, color: '#7ce4ff' });
                    }
                }
                else if (this.state === 'orbit') {
                    this.orbitAngle += this.orbitSpeed * dt;
                    const targetR = p.r * 2.2;
                    this.orbitRadius += (targetR - this.orbitRadius) * dt * 2.2;

                    this.x = p.x + Math.cos(this.orbitAngle) * this.orbitRadius;
                    this.y = p.y + Math.sin(this.orbitAngle) * this.orbitRadius;

                    for (const e of game.enemies) {
                        if (e.dead) continue;
                        const edx = e.x - this.x, edy = e.y - this.y;
                        const hitRadius = e.r + this.r;
                        if (edx * edx + edy * edy < hitRadius * hitRadius) {
                            const impactMass = this.mass + e.mass * 0.12;
                            const violent = this.r >= e.r * 0.72;
                            fragmentPlanet(e, this.x, this.y, this.vx, this.vy, impactMass, violent);
                            this.dead = true;
                            break;
                        }
                    }
                }

                if (this.state === 'free' && !this.dead) {
                    let hitEnemy = false;
                    for (const e of game.enemies) {
                        if (e.dead) continue;
                        const edx = e.x - this.x, edy = e.y - this.y;
                        if (edx * edx + edy * edy >= (e.r + this.r) * (e.r + this.r)) continue;
                        const impactMass = this.mass + e.mass * 0.12;
                        const violent = this.r >= e.r * 0.72;
                        fragmentPlanet(e, this.x, this.y, this.vx, this.vy, impactMass, violent);
                        this.dead = true;
                        hitEnemy = true;
                        break;
                    }
                    if (hitEnemy) return;
                }

                this.trail.unshift({ x: this.x, y: this.y });
                if (this.trail.length > this.maxTrail) this.trail.pop();
            }

            draw() {
                if (this.trail.length > 1) {
                    ctx.save();
                    ctx.globalCompositeOperation = 'lighter';
                    for (let i = 0; i < this.trail.length - 1; i += 2) {
                        const k = 1 - i / this.trail.length;
                        ctx.strokeStyle = `rgba(140, 225, 255, ${k * 0.75})`;
                        ctx.lineWidth = this.r * k * 1.6;
                        ctx.beginPath();
                        ctx.moveTo(this.trail[i].x, this.trail[i].y);
                        ctx.lineTo(this.trail[i + 1].x, this.trail[i + 1].y);
                        ctx.stroke();
                    }
                    ctx.restore();
                }

                ctx.save();
                ctx.globalCompositeOperation = 'lighter';
                const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.r * 3.0);
                g.addColorStop(0, '#ffffff');
                g.addColorStop(0.4, '#7ce4ff');
                g.addColorStop(1, 'rgba(0,160,255,0)');
                ctx.fillStyle = g; ctx.beginPath(); ctx.arc(this.x, this.y, this.r * 3.0, 0, TAU); ctx.fill();
                ctx.restore();
            }
        }

        function spawnComet() {
            const p = game.player;
            const viewR = Math.max(W, H) / (2 * game.cam.zoom);
            const ang = Math.random() * TAU;
            const spawnDist = viewR * 1.35;
            const x = p.x + Math.cos(ang) * spawnDist;
            const y = p.y + Math.sin(ang) * spawnDist;
            const toPlayer = Math.atan2(p.y - y, p.x - x) + rand(-0.4, 0.4);
            const spd = rand(200, 320);
            game.comets.push(new Comet(x, y, Math.cos(toPlayer) * spd, Math.sin(toPlayer) * spd));
        }

        const INITIAL_MASS = 100;
        const MAX_INITIAL_MASS = STAGES[10].min - 1;
        let selectedInitialMass = INITIAL_MASS;

        function formatMassRange(value) {
            let stageIndex = 0;
            while (stageIndex + 1 < STAGES.length && value >= STAGES[stageIndex + 1].min) stageIndex++;
            const stage = STAGES[stageIndex];
            const nextStage = STAGES[stageIndex + 1];
            return nextStage
                ? `当前阶段：${stage.name}（${fmtMass(stage.min)}–${fmtMass(nextStage.min - 1)}），范围：1–${fmtMass(MAX_INITIAL_MASS)}。`
                : `当前阶段：${stage.name}（${fmtMass(stage.min)} 以上）。`;
        }

        function updateMassInputRange(value) {
            document.getElementById('massInputRange').textContent = Number.isFinite(value) && value >= 1
                ? formatMassRange(value)
                : `范围：1–${fmtMass(MAX_INITIAL_MASS)}；阶段阈值与游戏内一致。`;
        }

        function resetGame() {
            const initialStage = stageOf(selectedInitialMass);
            const initialVariant = 0;
            const initialBody = CATALOG[initialStage][initialVariant];
            const p = {
                x: 0, y: 0, vx: 0, vy: 0,
                mass: selectedInitialMass,
                r: radiusOf(selectedInitialMass),
                angle: 0,
                stage: initialStage,
                variant: initialVariant,
                pulse: 0,
                label: initialBody.label,
                color: initialBody.color,
                glow: initialBody.glow,
                isPlayer: true,
            };
            if (initialStage >= 10) {
                p.variant = Math.floor(Math.random() * CATALOG[10].length);
                const blackHole = CATALOG[10][p.variant];
                p.label = blackHole.label;
                p.color = blackHole.color;
                p.glow = blackHole.glow;
            }
            game.player = p;
            game.enemies = [];
            game.comets = [];
            game.meteors = [];
            game.events = [];
            game.sparks = [];
            game.ripples = [];
            game.cam = { x: 0, y: 0, zoom: clamp((W < 700 ? 52 * 0.75 : 80) / p.r, 0.05, 1.15) };
            game.playTime = 0;
            game.shake = 0;
            game.spawnTimer = 0;
            game.cometSpawnTimer = 0;
            game.meteorSpawnTimer = 2.5;
            game.showerTimer = rand(15, 25);
            game.maxStage = initialStage;
            game.finale = null;
            game.poemShown = false;
            game.deathTimer = 0;

            /* 黑洞终章状态复位 */
            game.outroStarted = false;
            game.outroTimer = 0;
            game.redirectStarted = false;
            game.sceneStarted = false;

            game.state = 'play';

            poemState.active = false;
            poemState.t = 0;
            poemState.particles = [];
            poemState.overlayShown = false;

            resetStick();

            for (let i = 0; i < 36; i++) spawnEnemy(true);
        }

        function pickVariant(stageIdx) {
            const variants = CATALOG[stageIdx];
            const count = new Array(variants.length).fill(0);
            for (const e of game.enemies) {
                if (e.stage === stageIdx && !e.dead) count[e.variant]++;
            }
            let minC = Infinity;
            const pool = [];
            for (let i = 0; i < variants.length; i++) {
                if (count[i] < minC) { minC = count[i]; pool.length = 0; pool.push(i); }
                else if (count[i] === minC) pool.push(i);
            }
            return pool[Math.floor(Math.random() * pool.length)];
        }

        function spawnEnemy(initial, forceBlackHole = false) {
            const p = game.player;
            const zoom = game.cam.zoom;
            const baseR = Math.max(W, H) / (2 * zoom);
            const ang = Math.random() * TAU;
            const dist = initial ? rand(p.r * 2.0, baseR * 1.3) : baseR * rand(1.1, 1.5);

            const roll = Math.random();
            const calm = initial || game.playTime < 4;
            let mass;

            if (forceBlackHole) {
                mass = Math.max(STAGES[10].min * 1.05, p.mass * rand(0.75, 1.25));
            } else if (calm) {
                const balanceRoll = Math.random();
                if (balanceRoll < 0.48) mass = p.mass * rand(0.25, 0.68);
                else if (balanceRoll < 0.84) mass = p.mass * rand(0.68, 1.12);
                else mass = p.mass * rand(1.12, 1.55);
            } else if (roll < 0.38) {
                mass = p.mass * rand(0.12, 0.58);
            } else if (roll < 0.76) {
                mass = p.mass * rand(0.58, 1.12);
            } else if (roll < 0.94) {
                mass = p.mass * rand(1.12, 1.8);
            } else {
                mass = p.mass * rand(1.8, 2.4);
            }
            if (!forceBlackHole) mass = Math.min(mass, STAGES[10].min * 0.95);
            mass = Math.max(mass, 3);

            const stage = stageOf(mass);
            const variantIdx = pickVariant(stage);
            const variant = CATALOG[stage][variantIdx];
            const r = radiusOf(mass);

            const spawnX = p.x + Math.cos(ang) * dist;
            const spawnY = p.y + Math.sin(ang) * dist;
            const driftAngle = Math.random() * TAU;
            const spd = rand(12, 38);

            game.enemies.push({
                x: spawnX, y: spawnY,
                vx: Math.cos(driftAngle) * spd, vy: Math.sin(driftAngle) * spd,
                mass, r, stage,
                variant: variantIdx,
                label: variant.label,
                color: variant.color,
                glow: variant.glow,
                angle: Math.random() * TAU,
                spin: rand(-0.7, 0.7),
                aiTimer: 0,
                aiMode: Math.random() < 0.35 ? 'orbit' : 'normal',
                meteorSense: Math.random() < 0.26 ? 'smart' : Math.random() < 0.72 ? 'normal' : 'careless',
                meteorCheckTimer: rand(0.05, 0.35),
                dead: false,
            });
        }

        function addNpcCollisionShake(x, y) {
            const p = game.player;
            if (!p || !game.cam.zoom) return;

            const dx = x - p.x, dy = y - p.y;
            const viewR = Math.max(W, H) / (2 * game.cam.zoom);
            const falloff = clamp(1 - Math.hypot(dx, dy) / (viewR * 2), 0, 1);
            if (falloff > 0) game.shake = Math.max(game.shake, 8 * falloff);
        }

        function addCollisionRipple(x, y, r, color) {
            const size = Math.max(8, r);
            game.ripples.push({
                x, y, r: size * 0.45, max: size * 2.5,
                life: 0.9, color: color || '#9ae6ff'
            });
        }

        function devourDirect(victim, devourer, isPlayerDevourer) {
            victim.dead = true;
            const gainedMass = victim.mass * 0.95;
            devourer.mass += devourer.isPlayer ? gainedMass : Math.min(gainedMass, Math.max(0, STAGES[10].min * 0.95 - devourer.mass));
            devourer.r = radiusOf(devourer.mass);
            evolveEntity(devourer, stageOf(devourer.mass));
            if (isPlayerDevourer) devourer.pulse = 1;
            else addNpcCollisionShake(victim.x, victim.y);
            addSparks(victim.x, victim.y, victim.color, 12);
            addCollisionRipple(victim.x, victim.y, victim.r, victim.color);
        }

        const CAN_TEAR_RATIO = 1.3;

        function startTidalDisruption(victim, devourer, isPlayerDevourer) {
            victim.dead = true;
            const x = (victim.x + devourer.x) / 2, y = (victim.y + devourer.y) / 2;
            if (isPlayerDevourer) {
                game.shake = Math.min(game.shake + victim.r * 0.10, 5);
            } else addNpcCollisionShake(x, y);
            addCollisionRipple(x, y, victim.r, victim.color);
            addSparks(x, y, victim.color || '#ffcc88', 24);
            game.events.push(new TidalEvent(victim, devourer, isPlayerDevourer));
        }

        function mutualDestruction(a, b) {
            a.dead = true; b.dead = true;
            const x = (a.x + b.x) / 2, y = (a.y + b.y) / 2;
            game.events.push(new MutualCrashEvent(x, y, Math.max(a.r, b.r), a.color, b.color));
            addNpcCollisionShake(x, y);
            addCollisionRipple(x, y, Math.max(a.r, b.r), '#ffaa44');
            addSparks(x, y, '#ffaa44', 40);
        }

        const collisionCandidates = [];

        function checkEnemyCollisions() {
            const list = game.enemies;
            const p = game.player;
            const activeRadius = Math.max(W, H) / (2 * game.cam.zoom) * 1.5;
            const activeRadius2 = activeRadius * activeRadius;
            collisionCandidates.length = 0;
            for (let i = 0; i < list.length; i++) {
                const a = list[i];
                if (a.dead) continue;
                const adx = a.x - p.x, ady = a.y - p.y;
                if (adx * adx + ady * ady <= activeRadius2) collisionCandidates.push(a);
            }

            for (let i = 0; i < collisionCandidates.length; i++) {
                const a = collisionCandidates[i];
                if (a.dead) continue;

                for (let j = i + 1; j < collisionCandidates.length; j++) {
                    const b = collisionCandidates[j];
                    if (b.dead) continue;

                    const dx = b.x - a.x, dy = b.y - a.y;
                    const collisionR = a.r + b.r;
                    if (dx * dx + dy * dy > collisionR * collisionR) continue;

                    const ratio = a.mass / b.mass;
                    if (ratio > CAN_TEAR_RATIO) {
                        if (b.r < 4 || game.events.length >= 12) {
                            devourDirect(b, a, false);
                        } else {
                            startTidalDisruption(b, a, false);
                        }
                        if (a.dead) break;
                    } else if (ratio < 1 / CAN_TEAR_RATIO) {
                        if (a.r < 4 || game.events.length >= 12) {
                            devourDirect(a, b, false);
                        } else {
                            startTidalDisruption(a, b, false);
                        }
                        if (b.dead) break;
                    } else {
                        mutualDestruction(a, b);
                    }
                }
            }
        }

        function triggerPlayerShatter(p, e) {
            e.dead = true;
            const lostMass = p.mass * 0.42;
            const impactX = (p.x + e.x) * 0.5;
            const impactY = (p.y + e.y) * 0.5;
            p.mass = Math.max(15, p.mass - lostMass);
            p.r = radiusOf(p.mass);
            p.stage = stageOf(p.mass);
            p.variant = 0;

            game.shake = 12;
            game.events.push(new MutualCrashEvent((p.x + e.x) / 2, (p.y + e.y) / 2, Math.max(p.r, e.r), '#4a80c0', e.color || '#ff3333'));
            addCollisionRipple((p.x + e.x) / 2, (p.y + e.y) / 2, Math.max(p.r, e.r), e.color || '#ff3333');

            const dx = p.x - e.x, dy = p.y - e.y;
            const angle = Math.atan2(dy, dx);
            const knockback = Math.max(400, 240 / game.cam.zoom * 1.2);
            p.vx = Math.cos(angle) * knockback;
            p.vy = Math.sin(angle) * knockback;

            const count = Math.min(Math.max(1, 90 - game.enemies.length), 5);
            const fragMass = count ? lostMass / count : 0;
            for (let i = 0; i < count; i++) {
                const fa = (e.vx || 0) || (e.vy || 0) ? Math.atan2(e.vy || 0, e.vx || 0) + Math.PI + rand(-1.1, 1.1) : Math.random() * TAU;
                const fs = rand(70, 180);
                const fragmentStage = stageOf(fragMass);
                const fragmentVariant = fragmentStage === 0 ? 0 : Math.floor(Math.random() * CATALOG[fragmentStage].length);
                const variant = CATALOG[fragmentStage][fragmentVariant];
                game.enemies.push({
                    x: impactX + Math.cos(fa) * (p.r + 10), y: impactY + Math.sin(fa) * (p.r + 10),
                    vx: (e.vx || 0) * 0.16 + Math.cos(fa) * fs, vy: (e.vy || 0) * 0.16 + Math.sin(fa) * fs,
                    mass: fragMass, r: radiusOf(fragMass), stage: fragmentStage,
                    variant: fragmentVariant, label: variant.label, color: variant.color, glow: variant.glow, angle: Math.random() * TAU, spin: rand(-1, 1),
                    aiTimer: 0, aiMode: 'normal', meteorSense: 'careless', meteorCheckTimer: rand(0.2, 0.5), dead: false, debris: true
                });
            }
        }

        function gameOver() {
            if (game.state !== 'play') return;
            if (game.finale || game.poemShown) return;

            game.state = 'dying';
            game.deathTimer = 1.6;
            game.shake = Math.max(game.shake, 14);
            resetStick();
        }

        function updateCamera(dt) {
            const p = game.player;
            const targetRadius = W < 700 ? 52 : 80;
            const mobileZoom = W < 700 ? 0.75 : 1;
            const targetZoom = clamp(mobileZoom * targetRadius / p.r, 0.05, 1.15);

            const lookX = p.x + p.vx * 0.12;
            const lookY = p.y + p.vy * 0.12;

            const k = Math.min(1, dt * 4.2);
            game.cam.x += (lookX - game.cam.x) * k;
            game.cam.y += (lookY - game.cam.y) * k;
            game.cam.zoom += (targetZoom - game.cam.zoom) * Math.min(1, dt * 3.0);

            game.mouse.wx = game.cam.x + (game.mouse.sx - W / 2) / game.cam.zoom;
            game.mouse.wy = game.cam.y + (game.mouse.sy - H / 2) / game.cam.zoom;
        }

        function updatePlayer(dt) {
            if (game.finale || game.outroStarted) return;
            const p = game.player;
            const zoom = game.cam.zoom;

            // 屏幕速度恒定：zoom 越小（体型越大），世界速度越大
            const maxSpeed = 105 / zoom;
            const acc = Math.min(1, dt * 6.0);

            let tvx = 0, tvy = 0, hasInput = false;

            if (game.controlMode === 'stick') {
                const s = game.stick;
                if (s.active && s.strength > 0.02) {
                    tvx = s.dirX * maxSpeed * s.strength;
                    tvy = s.dirY * maxSpeed * s.strength;
                    hasInput = true;
                }
            } else {
                const ox = game.mouse.sx - W / 2;
                const oy = game.mouse.sy - H / 2;
                const d = Math.hypot(ox, oy);

                if (d > 5) {
                    const sens = 1.25;
                    tvx = (ox / d) * maxSpeed * sens;
                    tvy = (oy / d) * maxSpeed * sens;
                    hasInput = true;          // ★ 关键：以前漏了这一行
                }
