            }

            if (hasInput) {
                p.vx += (tvx - p.vx) * acc;
                p.vy += (tvy - p.vy) * acc;
            } else {
                const stop = Math.pow(0.0008, dt);
                p.vx *= stop;
                p.vy *= stop;
            }

            p.x += p.vx * dt; p.y += p.vy * dt;
            p.angle += dt * 0.55;
            p.r = radiusOf(p.mass);
            p.pulse *= Math.pow(0.02, dt);

            const ns = stageOf(p.mass);
            if (ns > p.stage) {
                p.stage = ns;
                p.variant = 0;
                game.maxStage = Math.max(game.maxStage, ns);
                game.shake = Math.min(game.shake + 4, 8);
                game.ripples.push({
                    x: p.x, y: p.y, r: p.r * 0.8, max: p.r * 12, life: 1,
                    color: (CATALOG[ns][0] && CATALOG[ns][0].glow) || '#ffffff'
                });
                addSparks(p.x, p.y, (CATALOG[ns][0] && CATALOG[ns][0].glow) || '#ffffff', 30);

            }
        }

        function updateEnemies(dt) {
            if (game.finale || game.outroStarted) return;

            const p = game.player;
            const viewR = Math.max(W, H) / (2 * game.cam.zoom);
            const removeDist2 = viewR * viewR * 9;
            const activeDist2 = viewR * viewR * 2.25;
            const debrisRemoveDist2 = viewR * viewR * 20.25;
                const npcDamp = dt >= 1 ? 0.76 : Math.exp(-0.2744368457017603 * dt);
            const debrisDamp = dt >= 1 ? 0.55 : Math.exp(-0.59783700075562 * dt);

            for (let i = game.enemies.length - 1; i >= 0; i--) {
                const e = game.enemies[i];
                if (e.dead) { game.enemies.splice(i, 1); continue; }

                const dx = p.x - e.x, dy = p.y - e.y;
                const d2 = dx * dx + dy * dy;
                if (e.debris && d2 > debrisRemoveDist2) {
                    game.enemies.splice(i, 1);
                    continue;
                }

                if (!e.debris && d2 > removeDist2) { game.enemies.splice(i, 1); continue; }
                const d = Math.sqrt(d2) || 1;

                const collisionRadius = p.r + e.r;
                if (d2 < collisionRadius * collisionRadius) {
                    if (stageOf(p.mass) >= 10 && stageOf(e.mass) >= 10) {
                        startFinale(e);
                        return;
                    }

                    const ratio = p.mass / e.mass;
                    if (ratio > CAN_TEAR_RATIO) {
                        devourDirect(e, p, true);
                    } else if (ratio < 1 / 2.8 && e.mass > p.mass * 2.5) {
                        game.events.push(new MutualCrashEvent(
                            p.x, p.y,
                            Math.max(p.r, e.r) * 1.5,
                            '#ff3333', e.color || '#4a80c0'
                        ));
                        game.shake = 16;
                        addCollisionRipple(p.x, p.y, Math.max(p.r, e.r), '#ff4444');
                        addSparks(p.x, p.y, '#ffaa44', 60);
                        gameOver();
                        return;
                    } else {
                        triggerPlayerShatter(p, e);
                    }

                }

                if (e.debris) {
                    const pull = 1500 * (1 - clamp(d / (viewR * 1.8), 0, 0.92));
                    e.vx += (dx / d) * pull * dt;
                    e.vy += (dy / d) * pull * dt;
                    e.angle += e.spin * dt;
                    e.vx *= debrisDamp; e.vy *= debrisDamp;
                    e.x += e.vx * dt * 0.62; e.y += e.vy * dt * 0.62;
                    continue;
                }

                if (d2 > activeDist2) continue;

                if (d > viewR * 1.3) {
                    const pullForce = (d - viewR * 1.25) * 1.2 * dt;
                    e.vx += (dx / d) * pullForce;
                    e.vy += (dy / d) * pullForce;
                }

                e.playerChaseTimer = Math.max(0, (e.playerChaseTimer || 0) - dt);
                e.aiTimer = (e.aiTimer || 0) - dt;

                if (e.aiTimer <= 0) {
                    let targetX = 0, targetY = 0, urgency = 0;
                    const playerThreat = e.mass > p.mass * 1.08;
                    const playerCanEat = p.mass > e.mass * 1.18;

                    if (e.playerChaseTimer > 0 && d < viewR * 1.25 && playerThreat) {
                        targetX = dx / d;
                        targetY = dy / d;
                        urgency = 0.72;
                    } else if (d < viewR * 1.25 && playerCanEat && e.aiMode === 'orbit') {
                        targetX = -dx / d;
                        targetY = -dy / d;
                        urgency = 0.48;
                    } else {
                        let bestPreyDist2 = viewR * viewR * 0.72;
                        let prey = null;
                        let nearestLargerDist2 = Infinity;
                        let largerThreat = null;

                        for (let j = 0; j < game.enemies.length; j++) {
                            if (j === i) continue;
                            const other = game.enemies[j];
                            if (other.dead || other.debris) continue;
                            const ox = other.x - e.x, oy = other.y - e.y;
                            const dist2 = ox * ox + oy * oy;
                            if (other.mass < e.mass / CAN_TEAR_RATIO && dist2 < bestPreyDist2) {
                                bestPreyDist2 = dist2;
                                prey = other;
                            } else if (other.mass > e.mass * CAN_TEAR_RATIO && dist2 < nearestLargerDist2) {
                                nearestLargerDist2 = dist2;
                                largerThreat = other;
                            }
                        }

                        if (prey) {
                            const pd = Math.sqrt(bestPreyDist2) || 1;
                            targetX = (prey.x - e.x) / pd;
                            targetY = (prey.y - e.y) / pd;
                            urgency = 0.72;
                            e.playerChaseTimer = 0;
                        } else if (largerThreat && nearestLargerDist2 < viewR * viewR * 0.2) {
                            const td = Math.sqrt(nearestLargerDist2) || 1;
                            targetX = (e.x - largerThreat.x) / td;
                            targetY = (e.y - largerThreat.y) / td;
                            urgency = 0.62;
                        } else if (e.aiMode === 'orbit') {
                            const tangent = Math.atan2(dy, dx) + (e.orbitDir || (e.orbitDir = Math.random() < 0.5 ? -1 : 1)) * Math.PI * 0.5;
                            targetX = Math.cos(tangent);
                            targetY = Math.sin(tangent);
                            urgency = 0.24;
                        }
                    }

                    if (d < viewR * 1.25 && playerThreat && e.playerChaseTimer <= 0 && Math.random() < 0.18) {
                        e.playerChaseTimer = rand(1.2, 2.4);
                        targetX = dx / d;
                        targetY = dy / d;
                        urgency = 0.72;
                    }

                    if (urgency > 0) {
                        const steering = (34 + urgency * 48) * 0.85;
                        e.vx += targetX * steering;
                        e.vy += targetY * steering;
                    }
                    e.aiTimer = rand(1.2, 2.2);
                }

                e.vx *= npcDamp; e.vy *= npcDamp;
                e.x += e.vx * dt * 0.54; e.y += e.vy * dt * 0.54;
                e.angle += e.spin * dt;

                if (d > viewR * 2.8) game.enemies.splice(i, 1);
            }
        }

        function updateComets(dt) {
            for (let i = game.comets.length - 1; i >= 0; i--) {
                const c = game.comets[i];
                c.update(dt);
                if (c.dead) { game.comets.splice(i, 1); }
            }
        }

        function updateMeteors(dt) {
            for (let i = game.meteors.length - 1; i >= 0; i--) {
                const m = game.meteors[i];
                m.update(dt);
                if (m.dead) { game.meteors.splice(i, 1); }
            }
        }

        function updateEvents(dt) {
            for (let i = game.events.length - 1; i >= 0; i--) {
                if (game.events[i].update(dt)) game.events.splice(i, 1);
            }
        }

        function updateSparks(dt) {
            for (let i = game.sparks.length - 1; i >= 0; i--) {
                const s = game.sparks[i];
                s.x += s.vx * dt; s.y += s.vy * dt;
                s.vx *= Math.pow(0.12, dt); s.vy *= Math.pow(0.12, dt);
                s.life -= dt * 1.9;
                if (s.life <= 0) game.sparks.splice(i, 1);
            }
        }

        function updateRipples(dt) {
            for (let i = game.ripples.length - 1; i >= 0; i--) {
                const r = game.ripples[i];
                if (r.maxLife === undefined) r.maxLife = r.life;
                r.life -= dt * 1.6;
                if (r.life <= 0) game.ripples.splice(i, 1);
            }
        }

        function spawnLogic(dt) {
            if (game.finale || game.outroStarted) return;

            if (stageOf(game.player.mass) >= 10 && !game.enemies.some(e => !e.dead && stageOf(e.mass) >= 10)) {
                spawnEnemy(false, true);
            }

            let alive = 0;
            for (let i = game.enemies.length - 1; i >= 0; i--) {
                if (game.enemies[i].dead) game.enemies.splice(i, 1);
                else alive++;
            }

            if (alive < 52) {
                game.spawnTimer -= dt;
                if (game.spawnTimer <= 0) {
                    spawnEnemy(false);
                    game.spawnTimer = 0.08;
                }
            } else {
                game.spawnTimer = 0;
            }

            game.cometSpawnTimer -= dt;
            if (game.cometSpawnTimer <= 0 && game.comets.length < 6) {
                spawnComet();
                game.cometSpawnTimer = rand(2.5, 5.0);
            }

            game.meteorSpawnTimer -= dt;
            if (game.meteorSpawnTimer <= 0 && game.meteors.length < 5) {
                spawnDangerMeteor(false);
                game.meteorSpawnTimer = rand(3.5, 6.0);
            }

            game.showerTimer -= dt;
            if (game.showerTimer <= 0) {
                const patterns = ['focused', 'fan', 'crossfire'];
                const pattern = patterns[Math.floor(Math.random() * patterns.length)];
                const showerCount = pattern === 'focused'
                    ? Math.floor(rand(8, 13))
                    : pattern === 'fan'
                        ? Math.floor(rand(4, 9))
                        : Math.floor(rand(6, 12));
                for (let i = 0; i < showerCount; i++) {
                    const delay = i * rand(110, 260);
                    setTimeout(() => {
                        if (game.state === 'play' && !game.finale) spawnDangerMeteor(true, pattern);
                    }, delay);
                }
                game.showerTimer = rand(17, 34);
            }
        }

        /* =========================================================
           双星合并动画（已停用，保留以备恢复）
           ========================================================= */
        function startFinale(source) {
            if (game.finale || game.poemShown || game.sceneStarted || !source) return;

            const p = game.player;
            if (stageOf(p.mass) < 10 || stageOf(source.mass) < 10) return;
            p.stage = 10;
            p.variant = 0;

            const ang = Math.random() * TAU;

            game.meteors.length = 0;
            game.comets.length = 0;
            for (const e of game.enemies) {
                if (!e.dead) addSparks(e.x, e.y, e.color || '#8ab4ff', 4);
            }
            game.enemies.length = 0;
            game.events.length = 0;
            resetStick();

            const D0 = Math.max(p.r * 6.0, 200);
            const partnerMass = source.mass;
            const partnerVariantIdx = source.variant;
            const partnerVariant = CATALOG[10][partnerVariantIdx] || CATALOG[10][0];

            const partner = {
                x: p.x + Math.cos(ang) * D0,
                y: p.y + Math.sin(ang) * D0,
                mass: partnerMass,
                r: radiusOf(partnerMass),
                stage: 10,
                variant: partnerVariantIdx,
                label: partnerVariant.label,
                color: partnerVariant.color,
                glow: partnerVariant.glow,
                angle: Math.random() * TAU,
                spin: 0.6,
            };

            const mt = p.mass + partnerMass;
            const playerVariantIdx = Math.floor(Math.random() * CATALOG[10].length);
            const playerVariant = CATALOG[10][playerVariantIdx];
            p.variant = playerVariantIdx;
            p.label = playerVariant.label;
            p.color = playerVariant.color;
            p.glow = playerVariant.glow;
            game.finale = {
                phase: 'inspiral',
                t: 0,
                duration: 9.5,
                partner,
                D0,
                D: D0,
                theta: ang,
                cx: (p.x * p.mass + partner.x * partnerMass) / mt,
                cy: (p.y * p.mass + partner.y * partnerMass) / mt,
                waveTimer: 0,
                mergerT: 0,
                flash: 0,
            };

            game.shake = 6;
            game.ripples.push({ x: game.finale.cx, y: game.finale.cy, r: p.r, max: p.r * 8, life: 1.2, color: '#9ac8ff' });
        }

        function updateFinale(dt) {
            const f = game.finale;
            if (!f) return;
            const p = game.player;
            const q = f.partner;

            if (f.phase === 'inspiral') {
                f.t += dt;
                const k = clamp(f.t / f.duration, 0, 1);

                const minD = (p.r + q.r) * 1.12 + 6;
                f.D = minD + (f.D0 - minD) * Math.pow(1 - k, 0.85);

                const omega = 0.55 + 4.2 * Math.pow(k, 1.7);
                f.theta += omega * dt;

                const mt = Math.max(1, p.mass + q.mass);
                const r1 = f.D * q.mass / mt;
                const r2 = f.D * p.mass / mt;

                p.x = f.cx + Math.cos(f.theta) * r1;
                p.y = f.cy + Math.sin(f.theta) * r1;
                q.x = f.cx - Math.cos(f.theta) * r2;
                q.y = f.cy - Math.sin(f.theta) * r2;

                p.angle += dt * (1.2 + k * 3);
                q.angle += dt * (1.6 + k * 3.4);
                p.vx = p.vy = 0;

                const drain = q.mass * (0.05 + k * 0.18) * dt;
                q.mass = Math.max(1, q.mass - drain);
                p.mass += drain;
                p.r = radiusOf(p.mass);
                q.r = radiusOf(q.mass);

                f.waveTimer -= dt;
                if (f.waveTimer <= 0) {
                    game.ripples.push({
                        x: f.cx, y: f.cy, r: f.D * 0.5, max: f.D * 3.6,
                        life: 1.0, color: '#9ac8ff'
                    });
                    f.waveTimer = Math.max(0.06, 0.3 - k * 0.24);
                }

                if (Math.random() < 0.55) {
                    const a = Math.random() * TAU;
                    const rr = f.D * 0.5;
                    game.sparks.push({
                        x: f.cx + Math.cos(a) * rr,
                        y: f.cy + Math.sin(a) * rr,
                        vx: -Math.sin(a) * rand(40, 150),
                        vy: Math.cos(a) * rand(40, 150),
                        life: 1, color: '#a8c8ff', size: rand(1, 3.2)
                    });
                }

                game.shake = 2 + k * 10;

                if (k >= 1) {
                    f.phase = 'merger';
                    f.mergerT = 0;
                    f.flash = 1;
                    game.shake = 22;

                    const mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2;
                    game.events.push(new MutualCrashEvent(mx, my, Math.max(p.r, q.r) * 1.2, '#dff0ff', '#8ab4ff'));
                    for (let i = 0; i < 6; i++) {
                        game.ripples.push({
                            x: mx, y: my, r: p.r * 1.2, max: p.r * (10 + i * 7),
                            life: 1.6, color: i % 2 ? '#ffffff' : '#9ac8ff'
                        });
                    }
                    addSparks(mx, my, '#ffffff', 120);

                    p.mass += q.mass;
                    p.r = radiusOf(p.mass);
                    p.x = mx; p.y = my;
                    q.mass = 0; q.r = 0;
                    f.cx = mx; f.cy = my;
                }
            } else if (f.phase === 'merger') {
                f.mergerT += dt;
                f.flash = Math.max(0, f.flash - dt * 0.75);
                game.shake = Math.max(0, 22 - f.mergerT * 12);
                p.angle += dt * 2.2;

                if (f.mergerT > 2.6) {
                    f.phase = 'done';
                    endWithNextScene();
                }
            }

            const span = Math.max(f.D + (p.r + q.r) * 2.4, p.r * 5.5, 240);
            const targetZoom = clamp(Math.min(W, H) * 0.9 / span, 0.008, 1.15);
            const camLerp = Math.min(1, dt * (f.phase === 'merger' ? 2.2 : 3.0));
            game.cam.x += (f.cx - game.cam.x) * camLerp;
            game.cam.y += (f.cy - game.cam.y) * camLerp;
            game.cam.zoom += (targetZoom - game.cam.zoom) * Math.min(1, dt * 1.8);
        }

        /* =========================================================
           黑洞终章：不播放双星合并，直接奇点膨胀 → 跳转
           ========================================================= */
        function enterSingularity() {
            if (game.outroStarted || game.state !== 'play') return;
            game.outroStarted = true;
            game.state = 'outro';
            game.outroTimer = 1.6;

            const p = game.player;
            if (!p) return;

            p.stage = 10;
            p.variant = 0;
            p.vx = 0;
            p.vy = 0;
            p.pulse = 1;
            p.singularityPulse = 0;

            /* 清空场上一切干扰 */
            game.meteors.length = 0;
            game.comets.length = 0;
            game.enemies.length = 0;
            game.events.length = 0;
            resetStick();

            hudEl.classList.remove('on');
            hintEl.style.opacity = '0';

            /* 奇点汇聚特效 */
            addSparks(p.x, p.y, '#ffe0b0', 140);
            for (let i = 0; i < 6; i++) {
                game.ripples.push({
                    x: p.x, y: p.y,
                    r: p.r * (1 + i * 0.4),
                    max: p.r * (9 + i * 5),
                    life: 1.6,
                    color: i % 2 ? '#ffffff' : '#ffb060'
                });
            }
            game.shake = 20;
        }

        function navigateToNextPage() {
            if (!NEXT_PAGE_URL || game.redirectStarted) return;
            game.redirectStarted = true;

            const targetUrl = new URL(NEXT_PAGE_URL, document.baseURI).href;
            const currentUrl = window.location.href;
            const showFallback = () => {
                document.getElementById('menuView').style.display = 'none';
                document.getElementById('overView').style.display = '';
                const overlay = document.getElementById('overlay');
                overlay.classList.remove('poem-mode', 'hide');
                overlay.classList.add('dim');
                document.getElementById('overTitle').textContent = '无法自动跳转';
                document.getElementById('result').innerHTML = `<span class="big">点击继续</span><a href="${targetUrl}" class="btn" style="display:inline-block;margin-top:20px;text-decoration:none;line-height:20px;">进入下一页面</a>`;
            };

            try {
                window.location.href = targetUrl;
            } catch (e) {
                showFallback();
                return;
            }

            setTimeout(() => {
                if (window.location.href === currentUrl) showFallback();
            }, 1200);
        }

        function endWithNextScene() {
            if (game.sceneStarted) return;
            game.sceneStarted = true;

            game.state = 'outro';
            game.outroTimer = 1.5;

            hudEl.classList.remove('on');
            hintEl.style.opacity = '0';
            resetStick();

            if (NEXT_PAGE_URL) {
                setTimeout(navigateToNextPage, 1600);
            } else {
                game.state = 'next';
            }
        }

        /* 旧版诗歌结局（保留，不再触发） */
        function endWithPoem() {
            if (game.poemShown) return;
            game.poemShown = true;
            game.state = 'poem';
            hudEl.classList.remove('on');
            startPoemAnimation();
        }

        function drawBackground() {
            const cam = game.cam;
            ctx.fillStyle = '#030409';
            ctx.fillRect(0, 0, W, H);

            ctx.globalCompositeOperation = 'lighter';
            for (const n of NEBULAS) {
                const px = ((n.x - cam.x * n.p) % (W + 1200) + W + 1200) % (W + 1200) - 600;
                const py = ((n.y - cam.y * n.p) % (H + 1200) + H + 1200) % (H + 1200) - 600;
                const g = ctx.createRadialGradient(px, py, 0, px, py, n.r);
                g.addColorStop(0, n.c1); g.addColorStop(1, n.c2);
                ctx.fillStyle = g; ctx.fillRect(px - n.r, py - n.r, n.r * 2, n.r * 2);
            }
            ctx.globalCompositeOperation = 'source-over';

            const t = game.time;
            for (const s of STARS) {
                const px = ((s.x - cam.x * s.p) % W + W) % W;
                const py = ((s.y - cam.y * s.p) % H + H) % H;
                const tw = 0.72 + 0.28 * Math.sin(t * 1.7 + s.tw);
                ctx.globalAlpha = s.a * tw; ctx.fillStyle = s.c;
                ctx.fillRect(px, py, s.s, s.s);
            }
            ctx.globalAlpha = 1;
        }

        function drawBlackHole(x, y, r, rot) {
            ctx.save();
            ctx.translate(x, y);

            ctx.globalCompositeOperation = 'lighter';
            const lensGlow = ctx.createRadialGradient(0, 0, r * 0.8, 0, 0, r * 5.5);
            lensGlow.addColorStop(0.0, 'rgba(255,230,180,0.85)');
            lensGlow.addColorStop(0.2, 'rgba(255,140,40,0.45)');
            lensGlow.addColorStop(0.6, 'rgba(160,30,10,0.12)');
            lensGlow.addColorStop(1.0, 'rgba(0,0,0,0)');
            ctx.fillStyle = lensGlow;
            ctx.beginPath(); ctx.arc(0, 0, r * 5.5, 0, TAU); ctx.fill();

            ctx.save();
            ctx.rotate(rot * 0.4); ctx.scale(1, 0.28);
            const diskGrad = ctx.createRadialGradient(0, 0, r * 1.1, 0, 0, r * 4.8);
            diskGrad.addColorStop(0.00, 'rgba(255,255,240,1.0)');
            diskGrad.addColorStop(0.15, 'rgba(255,190,80,0.9)');
            diskGrad.addColorStop(0.45, 'rgba(230,80,20,0.5)');
            diskGrad.addColorStop(1.00, 'rgba(50,0,0,0)');
            ctx.fillStyle = diskGrad;
            ctx.beginPath(); ctx.arc(0, 0, r * 4.8, 0, TAU); ctx.fill();
            ctx.restore();

            ctx.strokeStyle = 'rgba(255,245,220,0.95)';
            ctx.lineWidth = Math.max(1.5, r * 0.08);
            ctx.beginPath(); ctx.arc(0, 0, r * 1.08, 0, TAU); ctx.stroke();

            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = '#000000';
            ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
            ctx.restore();
        }

        function drawPlanetRing(x, y, r, rot, type, front) {
            const outer = r * 2.15;
            const inner = r * 1.22;
            const bands = type === 'saturn'
                ? [
                    [1.38, 0.12, 'rgba(230,211,164,0.82)'],
                    [1.60, 0.08, 'rgba(116,98,68,0.72)'],
                    [1.78, 0.14, 'rgba(219,197,146,0.78)'],
                    [2.02, 0.08, 'rgba(156,132,91,0.70)'],
                ]
                : [
                    [1.48, 0.08, type === 'ice' ? 'rgba(176,218,232,0.42)' : 'rgba(206,184,145,0.34)'],
                    [1.88, 0.06, type === 'ice' ? 'rgba(190,226,238,0.34)' : 'rgba(220,201,168,0.28)'],
                ];

            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rot * 0.08 + 0.28);
            ctx.scale(1, type === 'saturn' ? 0.28 : 0.2);
            ctx.beginPath();
            ctx.rect(-outer, front ? 0 : -outer, outer * 2, outer);
            ctx.clip();

            ctx.beginPath();
            ctx.ellipse(0, 0, outer, outer, 0, 0, TAU);
            ctx.ellipse(0, 0, inner, inner, 0, 0, TAU);
            ctx.fillStyle = type === 'saturn' ? 'rgba(188,163,116,0.58)' : 'rgba(170,198,210,0.16)';
            ctx.fill('evenodd');

            for (const [radius, width, color] of bands) {
                ctx.beginPath();
                ctx.ellipse(0, 0, r * radius, r * radius, 0, 0, TAU);
                ctx.strokeStyle = color;
                ctx.lineWidth = r * width;
                ctx.stroke();
            }
            ctx.restore();
        }

        function drawBody(x, y, r, stageIdx, variantIdx, rot) {
            if (r < 0.35) return;
            const stage = STAGES[stageIdx];
            const variant = CATALOG[stageIdx][variantIdx] || CATALOG[stageIdx][0];

            if (stage.type === 'blackhole') { drawBlackHole(x, y, r, rot); return; }
            if (variant.ring && r >= 6) drawPlanetRing(x, y, r, rot, variant.ring, false);

            if (stage.type === 'star' || stage.type === 'neutron') {
                const pulse = 1 + Math.sin(game.time * 2.2 + x * 0.005) * 0.06;
                const gr = r * (stage.type === 'neutron' ? 5.2 : 3.5) * pulse;
                ctx.globalCompositeOperation = 'lighter';
                ctx.globalAlpha = 0.9;
                ctx.drawImage(getGlow(variant.glow, 128), x - gr, y - gr, gr * 2, gr * 2);
                ctx.globalAlpha = 1;
                ctx.globalCompositeOperation = 'source-over';
            } else {
                const gr = r * 2.2;
                ctx.globalCompositeOperation = 'lighter';
                ctx.globalAlpha = 0.35;
                ctx.drawImage(getGlow(variant.glow, 128), x - gr, y - gr, gr * 2, gr * 2);
                ctx.globalAlpha = 1;
                ctx.globalCompositeOperation = 'source-over';
            }

            if (r < 6) {
                ctx.fillStyle = variant.color;
                ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); return;
            }

            const tex = getTex(stageIdx, variantIdx);
            const light = getLight();
            const zoom = game.cam.zoom;
            const tw = 2 * r;
            let off = (rot * r * 0.55) % tw;
            if (off < 0) off += tw;

            ctx.save();
            ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.clip();
            ctx.drawImage(tex, x - r + off, y - r, tw, tw);
            ctx.drawImage(tex, x - r + off - tw, y - r, tw + 1 / (DPR * zoom), tw);
            ctx.globalCompositeOperation = 'multiply';
            ctx.drawImage(light, x - r, y - r, tw, tw);
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = 'rgba(255,255,255,0.12)';
            ctx.beginPath(); ctx.ellipse(x - r * 0.33, y - r * 0.34, r * 0.32, r * 0.20, -0.72, 0, TAU); ctx.fill();
            ctx.restore();
            if (variant.ring) drawPlanetRing(x, y, r, rot, variant.ring, true);
        }

        function drawLabels() {
            const zoom = game.cam.zoom;
            const cam = game.cam;
            const halfW = W / (2 * zoom), halfH = H / (2 * zoom);
            const L = cam.x - halfW, R = cam.x + halfW;
            const T = cam.y - halfH, B = cam.y + halfH;

            const isMobile = W < 700;
            const minScreenR = isMobile ? 8 : 6;
            const fsMin = isMobile ? 9 : 10;
            const fsMax = isMobile ? 14 : 18;

            ctx.save();
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.lineJoin = 'round';

            const drawSingleLabel = (label, x, y, r) => {
                if (!label) return;
                const fsScreen = clamp(Math.round(r * zoom * 0.55), fsMin, fsMax);
                const fs = fsScreen / zoom;
                ctx.font = `600 ${fs}px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif`;
                const textY = y + r + fs * 0.55;

                ctx.lineWidth = Math.max(1.5, fs * 0.22);
                ctx.strokeStyle = 'rgba(2,4,12,0.88)';
                ctx.strokeText(label, x, textY);

                ctx.fillStyle = 'rgba(205,228,255,0.86)';
                ctx.fillText(label, x, textY);
            };

            for (const e of game.enemies) {
                if (e.dead || !e.label) continue;
                if (e.r * zoom < minScreenR) continue;
                if (e.x < L || e.x > R || e.y < T || e.y > B) continue;
                drawSingleLabel(e.label, e.x, e.y, e.r);
            }

            if (game.finale && game.finale.partner) {
                const p = game.player;
                const q = game.finale.partner;

                const pLabel = p.label || CATALOG[10][0].label;
                const qLabel = q.label || (CATALOG[10][q.variant] ? CATALOG[10][q.variant].label : '伴星黑洞');

                if (p.r * zoom >= minScreenR) drawSingleLabel(pLabel, p.x, p.y, p.r);
                if (q.r * zoom >= minScreenR) drawSingleLabel(qLabel, q.x, q.y, q.r);
            }

            ctx.restore();
        }

        function drawWorld() {
            const p = game.player;
            const zoom = game.cam.zoom;
            const cam = game.cam;

            const halfW = W / (2 * zoom), halfH = H / (2 * zoom);
            const L = cam.x - halfW - 200, R = cam.x + halfW + 200;
            const T = cam.y - halfH - 200, B = cam.y + halfH + 200;

            for (const e of game.enemies) {
                if (e.dead) continue;
                if (e.x < L - e.r || e.x > R + e.r || e.y < T - e.r || e.y > B + e.r) continue;
                drawBody(e.x, e.y, e.r, e.stage, e.variant, e.angle);
            }

            for (const c of game.comets) {
                if (c.x + c.r < L || c.x - c.r > R || c.y + c.r < T || c.y - c.r > B) continue;
                c.draw();
            }
            for (const m of game.meteors) {
                if (m.warningTimer <= 0 && (m.x + m.r < L || m.x - m.r > R || m.y + m.r < T || m.y - m.r > B)) continue;
                m.draw();
            }
            for (const ev of game.events) {
                if (!(ev instanceof TidalEvent)) ev.draw();
            }

            if (game.finale && game.finale.partner && game.finale.partner.r > 0.5) {
                const q = game.finale.partner;
                ctx.save();
                ctx.globalCompositeOperation = 'lighter';
                const bridge = ctx.createLinearGradient(p.x, p.y, q.x, q.y);
                bridge.addColorStop(0, 'rgba(255,180,80,0.25)');
                bridge.addColorStop(0.5, 'rgba(180,215,255,0.55)');
                bridge.addColorStop(1, 'rgba(120,160,255,0.25)');
                ctx.strokeStyle = bridge;
                ctx.lineWidth = Math.max(1.5, p.r * 0.06);
                const mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2;
                const nx = -(q.y - p.y), ny = (q.x - p.x);
                const nl = Math.hypot(nx, ny) || 1;
                const wave = Math.sin(game.time * 6) * p.r * 0.45;
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.quadraticCurveTo(mx + nx / nl * wave, my + ny / nl * wave, q.x, q.y);
                ctx.stroke();
                ctx.restore();

                drawBody(q.x, q.y, q.r, q.stage, q.variant, q.angle);
            }

            /* 玩家本体：play 与 outro（奇点膨胀）阶段都绘制 */
            if (game.player && (game.state === 'play' || game.state === 'outro')) {
                const pr = p.r * (1 + (p.pulse || 0) * 0.035);
                drawBody(p.x, p.y, pr, p.stage, 0, p.angle);
            }

            for (const ev of game.events) {
                if (ev instanceof TidalEvent) ev.draw();
            }

            drawLabels();

            for (const s of game.sparks) {
                ctx.globalAlpha = clamp(s.life, 0, 1) * 0.9;
                ctx.fillStyle = s.color;
                ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, TAU); ctx.fill();
            }
            ctx.globalAlpha = 1;

            for (const rp of game.ripples) {
                const k = clamp(1 - rp.life / rp.maxLife, 0, 1);
                const rad = Math.max(0, lerp(rp.r, rp.max, k));
                ctx.strokeStyle = rgba(rp.color, rp.life * 0.55);
                ctx.lineWidth = Math.max(0.8, rp.life * rp.r * 0.22 + 0.7);
                ctx.beginPath(); ctx.arc(rp.x, rp.y, rad, 0, TAU); ctx.stroke();
            }
        }

        function drawStick() {
            const s = game.stick;
            if (!s.active) return;

            const maxR = stickMaxR();
            const hx = s.anchorX + s.dirX * s.strength * maxR;
            const hy = s.anchorY + s.dirY * s.strength * maxR;

            ctx.save();

            ctx.beginPath();
            ctx.arc(s.anchorX, s.anchorY, maxR, 0, TAU);
            ctx.strokeStyle = 'rgba(140,200,255,0.30)';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(s.anchorX, s.anchorY, maxR * 0.36, 0, TAU);
            ctx.strokeStyle = 'rgba(140,200,255,0.18)';
            ctx.lineWidth = 1;
            ctx.stroke();

            if (s.strength > 0.02) {
                ctx.beginPath();
                ctx.moveTo(s.anchorX, s.anchorY);
                ctx.lineTo(hx, hy);
                ctx.strokeStyle = 'rgba(150,210,255,0.35)';
                ctx.lineWidth = 1.2;
                ctx.stroke();
            }

            const g = ctx.createRadialGradient(hx, hy, 0, hx, hy, 22);
            g.addColorStop(0, 'rgba(170,220,255,0.70)');
            g.addColorStop(1, 'rgba(100,170,255,0)');
            ctx.fillStyle = g;
            ctx.beginPath(); ctx.arc(hx, hy, 22, 0, TAU); ctx.fill();

            ctx.beginPath();
            ctx.arc(hx, hy, 10, 0, TAU);
            ctx.fillStyle = 'rgba(190,230,255,0.90)';
            ctx.fill();

            ctx.restore();
        }

        function render() {
            ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
            drawBackground();

            if (game.player) {
                const cam = game.cam;
                ctx.save();
                ctx.translate(W / 2, H / 2);

                if (game.shake > 0.15) {
                    const s = game.shake * 0.32;
                    ctx.translate(rand(-s, s), rand(-s, s));
                }

                ctx.scale(cam.zoom, cam.zoom);
                ctx.translate(-cam.x, -cam.y);

                const halfW = W / (2 * cam.zoom), halfH = H / (2 * cam.zoom);
                const viewL = cam.x - halfW - 200, viewR = cam.x + halfW + 200;
                const viewT = cam.y - halfH - 200, viewB = cam.y + halfH + 200;
                ctx.beginPath();
                ctx.rect(viewL, viewT, viewR - viewL, viewB - viewT);
                ctx.clip();

                drawWorld();
                ctx.restore();
            }

            if (game.state === 'poem' || poemState.active) {
                drawPoemAnimation();
            }

            drawStick();

            if (game.finale && game.finale.flash > 0.002) {
                const a = game.finale.flash;
                ctx.save();
                ctx.globalCompositeOperation = 'lighter';
                const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.75);
                g.addColorStop(0, `rgba(255,255,255,${a})`);
                g.addColorStop(0.35, `rgba(200,225,255,${a * 0.55})`);
                g.addColorStop(1, 'rgba(90,130,255,0)');
                ctx.fillStyle = g;
                ctx.fillRect(0, 0, W, H);
                ctx.restore();
            }

            /* 黑洞终章白闪 */
            if (game.state === 'outro' && game.player) {
                const t = game.player.singularityPulse || 0;
                const a = clamp(t / 1.6, 0, 1);
                ctx.save();
                ctx.globalCompositeOperation = 'lighter';
                const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.8);
                g.addColorStop(0, `rgba(255,255,255,${a * 0.95})`);
                g.addColorStop(0.35, `rgba(255,215,160,${a * 0.55})`);
                g.addColorStop(1, 'rgba(255,120,40,0)');
                ctx.fillStyle = g;
                ctx.fillRect(0, 0, W, H);
                ctx.restore();
            }
        }

        let last = performance.now();

        function loop(now) {
            const dt = Math.min((now - last) / 1000, 0.05);
            last = now;
            game.time += dt;

            if (game.state === 'play') {
                game.playTime += dt;

                updateCamera(dt);
                updatePlayer(dt);

                if (!game.outroStarted) {
                    updateEnemies(dt);
                    checkEnemyCollisions();
                    updateComets(dt);
                    updateMeteors(dt);
                    updateEvents(dt);
                    updateSparks(dt);
                    updateRipples(dt);
                    spawnLogic(dt);
                    if (game.finale) updateFinale(dt);
                    game.shake *= Math.pow(0.004, dt);
                    if (game.shake < 0.1) game.shake = 0;
                    updateHUD();
                } else {
                    updateEvents(dt);
                    updateSparks(dt);
                    updateRipples(dt);
                    game.shake *= Math.pow(0.004, dt);
                    if (game.shake < 0.1) game.shake = 0;
                }
            } else if (game.state === 'dying') {
                game.deathTimer -= dt;
                updateEvents(dt);
                updateSparks(dt);
                updateRipples(dt);
                game.shake *= Math.pow(0.004, dt);
                if (game.shake < 0.1) game.shake = 0;
                updateHUD();
                if (game.deathTimer <= 0) {
                    game.state = 'over';
                    showOver();
                }
            } else if (game.state === 'over') {
                updateEvents(dt);
                updateSparks(dt);
                updateRipples(dt);
                game.shake *= Math.pow(0.004, dt);
                if (game.shake < 0.1) game.shake = 0;
            } else if (game.state === 'poem') {
                updatePoemAnimation(dt);
                updateEvents(dt);
                updateSparks(dt);
                updateRipples(dt);
                game.shake *= Math.pow(0.004, dt);
                if (game.shake < 0.1) game.shake = 0;
            } else if (game.state === 'outro') {
                /* ===== 黑洞终章：奇点膨胀 + 白闪，然后跳转 ===== */
                game.outroTimer -= dt;

                const p = game.player;
                if (p) {
                    p.singularityPulse = (p.singularityPulse || 0) + dt;
                    p.r = radiusOf(p.mass) * (1 + p.singularityPulse * 1.8);
                    p.angle += dt * 3;
                }

                updateCamera(dt);
                updateEvents(dt);
                updateSparks(dt);
                updateRipples(dt);
                game.shake *= Math.pow(0.004, dt);
                if (game.shake < 0.1) game.shake = 0;

                if (game.outroTimer <= 0) {
                    if (NEXT_PAGE_URL) {
                        navigateToNextPage();
                    } else {
                        game.state = 'next';
                    }
                }
            } else if (game.state === 'next') {
                updateEvents(dt);
                updateSparks(dt);
                updateRipples(dt);
                game.shake *= Math.pow(0.004, dt);
                if (game.shake < 0.1) game.shake = 0;
            } else if (game.state === 'menu') {
                game.cam.x += dt * 26; game.cam.y += dt * 9;
            }

            render();
            requestAnimationFrame(loop);
        }
        const hudEl = document.getElementById('hud');
        const stageEl = document.getElementById('stageName');
        const massEl = document.getElementById('massVal');
        const fillEl = document.getElementById('fill');
        const cometEl = document.getElementById('cometCount');
        const hintEl = document.getElementById('hint');

        function fmtMass(m) {
            if (m < 1000) return m.toFixed(0);
            if (m < 1e6) return (m / 1000).toFixed(1) + 'K';
            if (m < 1e9) return (m / 1e6).toFixed(2) + 'M';
            return (m / 1e9).toFixed(2) + 'G';
        }

        function updateHUD() {
            const p = game.player;

            if (game.finale) {
                const f = game.finale;
                stageEl.textContent = f.phase === 'inspiral' ? '黑 洞 双 星' : '奇 点';
                massEl.textContent = fmtMass(p.mass);
                cometEl.textContent = f.phase === 'inspiral' ? '引力波辐射中…' : '时空在震颤…';
                fillEl.style.width = '100%';
                if (game.playTime > 7 && hintEl.style.opacity !== '0') {
                    hintEl.style.opacity = '0';
                }
                return;
            }

            const si = p.stage;
            stageEl.textContent = STAGES[si].name;
            massEl.textContent = fmtMass(p.mass);

            const orbitingCount = game.comets.filter(c => c.state === 'orbit').length;
            cometEl.textContent = `环绕彗星: ${orbitingCount}`;

            const next = STAGES[si + 1];
            if (next) {
                const prev = STAGES[si].min;
                const k = clamp((p.mass - prev) / (next.min - prev), 0, 1);
                fillEl.style.width = (k * 100).toFixed(1) + '%';
            } else {
                fillEl.style.width = '100%';
            }

            if (game.playTime > 7 && hintEl.style.opacity !== '0') {
                hintEl.style.opacity = '0';
            }
        }

        const overlayEl = document.getElementById('overlay');
        const menuView = document.getElementById('menuView');
        const overView = document.getElementById('overView');
        const resultEl = document.getElementById('result');
        const overTitleEl = document.getElementById('overTitle');
        const menuQuoteEl = document.getElementById('menuQuote');
        const menuQuotes = [
            '微小的起点，也能走向辽阔的星海。',
            '每一次探索，都会点亮新的方向。',
            '坚持前行，终会抵达属于你的轨道。',
            '从一粒尘埃开始，也能拥抱星辰。',
            '不必一开始就耀眼，持续前进就是光。'
        ];
        const defeatQuotes = [
            '跌落不是终点，重新出发就是新的轨道。',
            '每一次失败，都在为下一次突破积蓄引力。',
            '星辰也曾暗淡，别停下，下一局继续发光。',
            '这一程暂时结束了，但你的宇宙还可以更大。',
            '强者不是从未坠落，而是一次次重新启航。',
            '把这次失误留在身后，下一次由你改写轨迹。',
            '宇宙没有白走的路，带着经验再闯一次。',
            '别气馁，成长正在悄悄积累，重新开始吧！',

            '新的开始就在眼前，再试一次，吞下整片星海！'
        ];

        function showMenu() {
            menuView.style.display = '';
            overView.style.display = 'none';
            menuQuoteEl.textContent = menuQuotes[Math.floor(Math.random() * menuQuotes.length)];
            overlayEl.classList.remove('poem-mode');
            overlayEl.classList.remove('dim');
            overlayEl.classList.remove('hide');
        }

        function showOver() {
            const p = game.player;
            menuView.style.display = 'none';
            overView.style.display = '';
            overlayEl.classList.remove('poem-mode');
            overlayEl.classList.add('dim');
            overlayEl.classList.remove('hide');
            overTitleEl.textContent = defeatQuotes[Math.floor(Math.random() * defeatQuotes.length)];

            resultEl.innerHTML = `
        <span class="big">${STAGES[p.stage].name}</span>
        终焉质量 ${fmtMass(p.mass)}<br>
        存续时间 ${game.playTime.toFixed(1)} 秒<br>
        最高阶段 ${STAGES[game.maxStage].name}
      `;
            resultEl.classList.remove('fadeIn');
            void resultEl.offsetWidth;
            resultEl.classList.add('fadeIn');
        }

        function showPoemOver() {
            menuView.style.display = 'none';
            overView.style.display = '';
            overlayEl.classList.remove('dim');
            overlayEl.classList.add('poem-mode');
            overlayEl.classList.remove('hide');

            resultEl.innerHTML = `
        <div class="poem-sub">终焉质量 ${fmtMass(game.player.mass)} · 存续 ${game.playTime.toFixed(1)} 秒</div>
      `;
            resultEl.classList.remove('fadeIn');
            void resultEl.offsetWidth;
            resultEl.classList.add('fadeIn');
        }

        function beginGame() {
            const massInput = document.getElementById('initialMassInput');
            const massInputError = document.getElementById('massInputError');
            const inputMass = massInput.valueAsNumber;
            updateMassInputRange(inputMass);
            if (!Number.isFinite(inputMass) || inputMass < 1 || inputMass >= STAGES[10].min) {
                massInputError.textContent = `请输入 1 到 ${fmtMass(MAX_INITIAL_MASS)}；开局质量不能达到黑洞阶段。`;
                massInput.focus();
                return;
            }
            selectedInitialMass = inputMass;
            massInputError.textContent = '';

            overlayEl.classList.remove('poem-mode');
            overlayEl.classList.remove('dim');
            overlayEl.classList.add('hide');
            hudEl.classList.add('on');
            hintEl.style.opacity = '1';
            isPointerDown = false;
            activePointerId = null;
            game.touchIndicator.active = false;
            game.mouse.sx = W / 2;
            game.mouse.sy = H / 2;
            resetStick();

            if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) {
                game.controlMode = 'stick';
            } else {
                game.controlMode = 'pointer';
            }

            resetGame();
        }

        document.getElementById('startBtn').addEventListener('click', beginGame);
        document.getElementById('againBtn').addEventListener('click', beginGame);
        document.getElementById('initialMassInput').addEventListener('input', () => {
            document.getElementById('massInputError').textContent = '';
            updateMassInputRange(document.getElementById('initialMassInput').valueAsNumber);
        });

        resize();
        updateMassInputRange(INITIAL_MASS);
        showMenu();
        requestAnimationFrame(loop);
        try {
            preloadTextures();
        } catch (error) {
            console.error('Texture preload failed:', error);
        }
    </script>
</body>
</html>
