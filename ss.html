<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#020308">
  <title>GALAXY · 再来一局</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 24px;
      color: #dbe9ff;
      background: radial-gradient(ellipse at 50% 42%, #14264a 0%, #080d1b 42%, #020308 78%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .45;
      background-image: radial-gradient(1px 1px at 12% 22%, #d8e8ff 55%, transparent), radial-gradient(1px 1px at 78% 18%, #d8e8ff 55%, transparent), radial-gradient(1.5px 1.5px at 65% 74%, #9bc8ff 55%, transparent), radial-gradient(1px 1px at 28% 82%, #fff 55%, transparent), radial-gradient(1px 1px at 90% 62%, #fff 55%, transparent);
      background-size: 260px 230px;
    }
    main { position: relative; width: min(100%, 460px); text-align: center; }
    .eyebrow { color: rgba(150, 195, 255, .62); font-size: 11px; letter-spacing: 5px; }
    h1 {
      margin: 18px 0 12px;
      font-size: clamp(32px, 9vw, 48px);
      font-weight: 300;
      letter-spacing: 8px;
      text-indent: 8px;
      background: linear-gradient(180deg, #fff, #71b8ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 32px rgba(100, 170, 255, .2);
    }
    p { margin: 0 0 34px; color: rgba(185, 210, 250, .68); font-size: 14px; line-height: 1.9; }
    button {
      width: min(100%, 360px);
      min-height: 82px;
      padding: 14px 22px;
      border: 1px solid rgba(125, 190, 255, .62);
      border-radius: 8px;
      color: #eef7ff;
      background: linear-gradient(135deg, rgba(42, 105, 190, .34), rgba(75, 120, 210, .16));
      box-shadow: 0 0 32px rgba(65, 145, 255, .14), inset 0 0 22px rgba(120, 185, 255, .06);
      cursor: pointer;
      font: inherit;
      touch-action: manipulation;
      transition: background .2s, box-shadow .2s, transform .2s;
    }
    button:hover, button:active { background-color: rgba(80, 150, 255, .28); box-shadow: 0 0 38px rgba(80, 170, 255, .34); transform: translateY(-2px); }
    button span, button small { display: block; }
    button span { font-size: 17px; letter-spacing: 4px; text-indent: 4px; }
    button small { margin-top: 8px; color: rgba(190, 220, 255, .78); font-size: 12px; letter-spacing: .5px; }
    .foot { margin-top: 22px; color: rgba(145, 175, 220, .4); font-size: 11px; letter-spacing: 1px; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">A NEW ORBIT AWAITS</div>
    <h1>星河未尽</h1>
    <p>每一次重新启程，都是新的演化。</p>
    <button id="replayBtn" type="button">
      <span>再来一局</span>
      <small id="quote" aria-live="polite"></small>
    </button>
    <div class="foot">点击按钮，回到宇宙起点</div>
  </main>
  <script>
    const quotes = [
      '别怕从微小开始，星辰也是如此。',
      '穿过黑暗，仍要奔向自己的光。',
      '每一次重来，都是新的可能。',
      '沿着自己的轨道，终会抵达远方。',
      '向前一点点，宇宙就更辽阔一点。',
      '微光也有方向，慢慢走也会发亮。',
      '把今天走好，明天就会更近一点。',
      '即使暂时迷航，也别停止探索。'
    ];
    document.getElementById('quote').textContent = quotes[Math.floor(Math.random() * quotes.length)];
    document.getElementById('replayBtn').addEventListener('click', () => {
      window.location.href = new URL('galaxy.html', window.location.href).href;
    });
  </script>
</body>
</html>
